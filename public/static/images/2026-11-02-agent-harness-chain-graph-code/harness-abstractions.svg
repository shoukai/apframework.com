<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Chain、Graph 与 Code harness 的结构比较</title>
  <desc id="desc">概念图比较线性链、显式控制图和代码执行验证环，并列出三者共同需要的验证、受控执行与可观测性。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="#f8fafc"/>
  <text x="48" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">三种 Agent 执行抽象：控制结构逐步显式化</text>
  <text x="48" y="88" font-family="Arial, sans-serif" font-size="16" fill="#475569">概念比较，不表示必须按时间顺序替换</text>

  <g transform="translate(48,125)">
    <rect width="340" height="390" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="340" height="56" rx="8" fill="#dbeafe"/>
    <text x="22" y="37" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Chain / 链</text>
    <rect x="24" y="100" width="78" height="54" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
    <rect x="132" y="100" width="78" height="54" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
    <rect x="240" y="100" width="78" height="54" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="63" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">步骤 A</text>
    <text x="171" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">步骤 B</text>
    <text x="279" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">步骤 C</text>
    <path d="M103 127H126" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M211 127H234" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="24" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">显式内容</text>
    <text x="24" y="244" font-family="Arial, sans-serif" font-size="15" fill="#334155">顺序；前一步输出成为后一步输入</text>
    <text x="24" y="286" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">适用侧重</text>
    <text x="24" y="315" font-family="Arial, sans-serif" font-size="15" fill="#334155">流程窄、输入稳定、低延迟</text>
    <text x="24" y="357" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b45309">边界：错误可能级联</text>
  </g>

  <g transform="translate(430,125)">
    <rect width="340" height="390" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="340" height="56" rx="8" fill="#dcfce7"/>
    <text x="22" y="37" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#166534">Graph / 图</text>
    <rect x="25" y="103" width="86" height="50" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
    <rect x="226" y="82" width="88" height="50" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
    <rect x="226" y="157" width="88" height="50" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
    <rect x="118" y="225" width="100" height="50" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="68" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">路由</text>
    <text x="270" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">工具 / LLM</text>
    <text x="270" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">校验 / 重试</text>
    <text x="168" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">状态汇总</text>
    <path d="M112 122L220 104" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M112 134L220 176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M267 134L213 219" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M225 182C185 197 160 177 185 148" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blueArrow)"/>
    <text x="24" y="315" font-family="Arial, sans-serif" font-size="15" fill="#334155">分支、状态、并行与恢复路径</text>
    <text x="24" y="357" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b45309">边界：状态空间难维护</text>
  </g>

  <g transform="translate(812,125)">
    <rect width="340" height="390" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="340" height="56" rx="8" fill="#f3e8ff"/>
    <text x="22" y="37" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#6b21a8">Code / 执行环</text>
    <rect x="112" y="88" width="116" height="46" rx="6" fill="#faf5ff" stroke="#c084fc"/>
    <rect x="218" y="168" width="100" height="46" rx="6" fill="#faf5ff" stroke="#c084fc"/>
    <rect x="112" y="248" width="116" height="46" rx="6" fill="#faf5ff" stroke="#c084fc"/>
    <rect x="22" y="168" width="100" height="46" rx="6" fill="#faf5ff" stroke="#c084fc"/>
    <text x="170" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">生成计划 / 代码</text>
    <text x="268" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">沙箱执行</text>
    <text x="170" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">测试 / 断言</text>
    <text x="72" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">修正重试</text>
    <path d="M221 133L250 163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M267 215L221 243" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M111 270L77 219" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M74 166L119 137" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="24" y="335" font-family="Arial, sans-serif" font-size="14" fill="#334155">隔离执行 + 可验证反馈</text>
    <text x="24" y="365" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309">边界：通过测试不等于语义正确</text>
  </g>

  <rect x="48" y="550" width="1104" height="98" rx="8" fill="#e2e8f0"/>
  <text x="72" y="585" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">三者共同需要的运行边界</text>
  <text x="72" y="620" font-family="Arial, sans-serif" font-size="16" fill="#334155">验证模型输出</text>
  <circle cx="242" cy="614" r="4" fill="#64748b"/>
  <text x="265" y="620" font-family="Arial, sans-serif" font-size="16" fill="#334155">受控执行与权限</text>
  <circle cx="462" cy="614" r="4" fill="#64748b"/>
  <text x="485" y="620" font-family="Arial, sans-serif" font-size="16" fill="#334155">状态与轨迹可观测</text>
  <circle cx="706" cy="614" r="4" fill="#64748b"/>
  <text x="729" y="620" font-family="Arial, sans-serif" font-size="16" fill="#334155">失败后的恢复与反馈</text>
</svg>