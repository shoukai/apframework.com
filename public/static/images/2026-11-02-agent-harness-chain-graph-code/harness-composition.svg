<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">组合式 Agent Harness：显式控制、受限执行与验证反馈</title>
  <desc id="desc">Graph 作为流程骨架，依次完成授权与上下文检查、模型规划、受限工具或代码执行、结果校验；失败回到修正节点，成功汇入结果，并由共享状态与轨迹支撑恢复和审计。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#475569"/></marker>
    <marker id="returnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#c2410c"/></marker>
    <style>
      .heading{font-family:sans-serif;font-size:27px;font-weight:700;fill:#172033}
      .sub{font-family:sans-serif;font-size:16px;fill:#475569}
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .node{stroke-width:2}
      .txt{font-family:sans-serif;font-size:17px;fill:#172033;text-anchor:middle}
      .small{font-family:sans-serif;font-size:15px;fill:#334155;text-anchor:middle}
      .state{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}
      .flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
      .retry{fill:none;stroke:#c2410c;stroke-width:3;marker-end:url(#returnArrow)}
      .label{font-family:sans-serif;font-size:14px;font-weight:700;fill:#9a3412}
      .note{font-family:sans-serif;font-size:16px;font-weight:700;fill:#172033}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text class="heading" x="48" y="54">组合式 Harness：Graph 管控流程，Code 与模型协作</text>
  <text class="sub" x="48" y="84">抽象可以嵌套组合；每一步仍需明确状态、权限与验收边界</text>

  <rect class="lane" x="48" y="116" width="1104" height="332" rx="8"/>
  <rect x="48" y="116" width="1104" height="48" rx="8" fill="#e2e8f0"/>
  <text class="txt" x="600" y="147" font-weight="700">Graph 编排层：显式状态转移、分支與恢复</text>

  <rect class="node" x="82" y="220" width="190" height="88" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text class="txt" x="177" y="255">权限与上下文</text>
  <text class="small" x="177" y="282">确定性检查</text>

  <rect class="node" x="354" y="220" width="190" height="88" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text class="txt" x="449" y="255">模型规划</text>
  <text class="small" x="449" y="282">生成候选步骤</text>

  <rect class="node" x="626" y="220" width="210" height="88" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="txt" x="731" y="255">受限工具 / 代码</text>
  <text class="small" x="731" y="282">沙箱与最小权限</text>

  <rect class="node" x="918" y="220" width="190" height="88" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="txt" x="1013" y="255">结果校验</text>
  <text class="small" x="1013" y="282">规则、测试、schema</text>

  <path class="flow" d="M272 264H346"/>
  <path class="flow" d="M544 264H618"/>
  <path class="flow" d="M836 264H910"/>
  <path class="flow" d="M1013 308V352H1013V360"/>
  <rect class="node" x="918" y="360" width="190" height="62" rx="8" fill="#ecfccb" stroke="#65a30d"/>
  <text class="txt" x="1013" y="399">接受并返回结果</text>
  <text class="label" x="932" y="340">通过</text>

  <path class="retry" d="M1013 220V190H449V212"/>
  <text class="label" x="580" y="180">失败：带诊断信息回到规划修正</text>

  <rect class="state" x="82" y="482" width="1026" height="92" rx="8"/>
  <text class="note" x="108" y="516">跨步骤共享的运行时保障</text>
  <rect x="100" y="530" width="220" height="36" rx="4" fill="#f1f5f9"/>
  <rect x="346" y="530" width="220" height="36" rx="4" fill="#f1f5f9"/>
  <rect x="620" y="530" width="220" height="36" rx="4" fill="#f1f5f9"/>
  <rect x="882" y="530" width="220" height="36" rx="4" fill="#f1f5f9"/>
  <text class="small" x="210" y="550">持久化状态</text>
  <circle cx="330" cy="545" r="4" fill="#64748b"/>
  <text class="small" x="456" y="550">权限与数据边界</text>
  <circle cx="602" cy="545" r="4" fill="#64748b"/>
  <text class="small" x="730" y="550">日志与执行轨迹</text>
  <circle cx="864" cy="545" r="4" fill="#64748b"/>
  <text class="small" x="992" y="550">人工接管与恢复</text>
  <text class="sub" x="48" y="612">示意图表达一种可选组合，不代表唯一架构；每个检查项需由具体任务定义。</text>
</svg>
