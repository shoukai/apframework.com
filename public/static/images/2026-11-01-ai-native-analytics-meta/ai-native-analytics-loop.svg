<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title desc">
  <title id="title">AI-native Analytics 的模式、查询与消费链路</title>
  <desc id="desc">分析库生成管道和类型化数据模型；确定性查询器依据模型选择数据源并生成 SQL，结果进入分析配方和仪表盘。图示为逻辑结构，不表示内部部署拓扑。</desc>
  <rect width="1240" height="640" fill="#ffffff"/>
  <text x="56" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172554">AI-native Analytics：共享模式与确定性查询</text>
  <text x="56" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">按 Meta 文章描述整理的概念示意，并非其内部部署拓扑</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="145" width="220" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="170" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">分析需求</text><text x="170" y="211" text-anchor="middle" font-size="15" fill="#334155">指标 / 事件 / 窗口</text><text x="170" y="235" text-anchor="middle" font-size="15" fill="#334155">维度 / 过滤条件</text>
    <rect x="350" y="145" width="230" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="465" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">Analytics Library</text><text x="465" y="211" text-anchor="middle" font-size="15" fill="#334155">受治理的参数化模式</text><text x="465" y="235" text-anchor="middle" font-size="15" fill="#334155">结构化声明 → 管道</text>
    <rect x="650" y="110" width="230" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="765" y="147" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">物化指标管道</text><text x="765" y="177" text-anchor="middle" font-size="15" fill="#334155">统一逻辑计算结果</text>
    <rect x="650" y="300" width="230" height="110" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="765" y="338" text-anchor="middle" font-size="19" font-weight="700" fill="#5b21b6">类型化数据模型</text><text x="765" y="368" text-anchor="middle" font-size="15" fill="#334155">维度 / 指标 / 数据源</text><text x="765" y="391" text-anchor="middle" font-size="14" fill="#475569">管道产出的 Agent-readable model</text>
    <rect x="950" y="145" width="230" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="1065" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">确定性查询器</text><text x="1065" y="211" text-anchor="middle" font-size="15" fill="#334155">按规则选数据源</text><text x="1065" y="235" text-anchor="middle" font-size="15" fill="#334155">生成 SQL</text>
    <rect x="350" y="485" width="330" height="95" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="515" y="522" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">分析配方</text><text x="515" y="552" text-anchor="middle" font-size="15" fill="#334155">按步骤调查指标变化与漏斗问题</text>
    <rect x="820" y="485" width="330" height="95" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="985" y="522" text-anchor="middle" font-size="19" font-weight="700" fill="#134e4a">仪表盘与分析体验</text><text x="985" y="552" text-anchor="middle" font-size="15" fill="#334155">指标调查 / 增长 / 留存 / 漏斗</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="3"><path d="M280 205 H350"/><path d="M580 180 H650"/><path d="M580 230 C615 230 615 355 650 355"/><path d="M880 355 C920 355 915 230 950 230"/><path d="M880 180 H950"/><path d="M1065 265 V435 H515 V485"/><path d="M1065 265 V435 H985 V485"/></g>
  <g fill="#475569"><polygon points="342,205 350,200 350,210"/><polygon points="642,180 650,175 650,185"/><polygon points="642,355 650,350 650,360"/><polygon points="942,230 950,225 950,235"/><polygon points="507,477 515,485 523,477"/><polygon points="977,477 985,485 993,477"/></g>
  <path d="M765 210 V300" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6"/><text x="786" y="263" font-family="Arial, sans-serif" font-size="13" fill="#6d28d9">模式生成模型</text>
  <path d="M765 410 V452 H1065 V265" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6"/><text x="790" y="443" font-family="Arial, sans-serif" font-size="13" fill="#6d28d9">模型作为查询输入</text>
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="14" fill="#64748b">边界：查询模型与 SQL 生成不自动授予数据访问权限，也不代表行动写回授权。</text>
</svg>