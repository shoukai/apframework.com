<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">业务应用与 OpenFGA 的数据边界</title>
  <desc id="desc">业务系统通常维护用户资料、资源内容、实体层级和搜索字段；OpenFGA 存放授权模型和关系元组并处理授权查询。授权关系可以由应用同步写入，请求上下文也可按需提供。示意不代表分布式事务保证。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#16836d"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17212b}.title{font-size:21px;font-weight:650}.label{font-size:17px;font-weight:650}.subhead{font-size:14px;font-weight:650}.body{font-size:13px;fill:#435264}.note{font-size:12px;fill:#566473}</style>
  </defs>
  <rect width="1120" height="430" rx="8" fill="#f7fafc"/>
  <text class="title" x="36" y="40">授权数据边界：谁是每类事实的维护者？</text>
  <text class="note" x="36" y="65">常见职责划分示意；实际数据归属需按业务系统设计</text>
  <rect x="50" y="112" width="420" height="244" rx="8" fill="#ffffff" stroke="#8ba0b4" stroke-width="1.4"/>
  <rect x="650" y="112" width="420" height="244" rx="8" fill="#eef5ff" stroke="#5079a8" stroke-width="1.4"/>
  <text class="label" x="76" y="150">业务应用与数据库</text><text class="note" x="76" y="174">通常由业务或身份系统维护</text>
  <text class="subhead" x="78" y="216">用户资料</text><text class="body" x="78" y="238">名称、账号、组织身份</text>
  <text class="subhead" x="78" y="270">资源与业务数据</text><text class="body" x="78" y="292">文档内容、项目层级、搜索字段</text>
  <text class="subhead" x="78" y="324">业务操作与同步流程</text>
  <text class="label" x="676" y="150">OpenFGA Store</text><text class="note" x="676" y="174">模型规则与关系授权数据</text>
  <text class="subhead" x="678" y="216">Authorization Model</text><text class="body" x="678" y="238">声明关系类型与权限推导规则</text>
  <text class="subhead" x="678" y="270">Relationship Tuples</text><text class="body" x="678" y="292">记录直接分享、成员关系等事实</text>
  <text class="subhead" x="678" y="324">Check / List 查询</text>
  <path d="M470 220H650" stroke="#16836d" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text class="note" x="489" y="204">按设计同步关系</text>
  <path d="M650 286H470" stroke="#52657a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text class="note" x="500" y="311">授权决策</text>
  <path d="M470 330C525 385 595 385 650 330" stroke="#d28b26" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <text class="note" x="476" y="374">请求时可附 Contextual Tuples</text>
  <text class="note" x="220" y="410">关系同步由应用架构负责；此图不表示跨系统原子事务</text>
</svg>