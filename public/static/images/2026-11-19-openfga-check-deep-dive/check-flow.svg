<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">一次 OpenFGA Check 的完整主流程</title>
  <desc id="desc">请求经过校验后按 Store 配置进入 v1 或 weighted-graph v2。v2 成功和终止错误分别直接返回；其他错误进入 v1 resolver 求值。v1 成功节点向客户端返回结果，并从节点右侧分叉启动两类异步 shadow。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#53666b"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d7185"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#477b70"/></marker>
    <marker id="shadowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a7851"/></marker>
    <style>
      .title{font:700 28px Arial,'Noto Sans CJK SC',sans-serif;fill:#203438}.sub{font:18px Arial,'Noto Sans CJK SC',sans-serif;fill:#53666b}.head{font:700 20px Arial,'Noto Sans CJK SC',sans-serif}.label{font:700 17px Arial,'Noto Sans CJK SC',sans-serif;fill:#263a3e}.body{font:15px Arial,'Noto Sans CJK SC',sans-serif;fill:#34484c}.small{font:14px Arial,'Noto Sans CJK SC',sans-serif;fill:#53666b}.box{stroke-width:2}.line{fill:none;stroke:#53666b;stroke-width:2.3;marker-end:url(#arrow)}.bline{fill:none;stroke:#3d7185;stroke-width:2.3;marker-end:url(#blue)}.gline{fill:none;stroke:#477b70;stroke-width:2.3;marker-end:url(#green)}.shadow{fill:none;stroke:#9a7851;stroke-width:2.1;stroke-dasharray:7 6;marker-end:url(#shadowArrow)}
      .shadow-joint{fill:#9a7851;stroke:#fff;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="1080" fill="#ffffff"/>
  <text class="title" x="60" y="52">一次 Check：完整主流程与两类 shadow</text>
  <text class="sub" x="60" y="82">实线表示主控制流；虚线从 v1 求值成功处分叉，表示异步对照</text>

  <rect class="box" x="300" y="112" width="600" height="70" rx="8" fill="#eef2f2" stroke="#829195"/>
  <text class="label" x="600" y="143" text-anchor="middle">HTTP / gRPC 请求 · 校验 · 可选访问控制</text><text class="small" x="600" y="168" text-anchor="middle">访问控制按部署配置执行</text>
  <path class="line" d="M600 182 V214"/>
  <rect class="box" x="370" y="216" width="460" height="70" rx="8" fill="#f5f1e6" stroke="#b39b63"/>
  <text class="label" x="600" y="246" text-anchor="middle">按 Store 配置选择主求值器</text><text class="small" x="600" y="271" text-anchor="middle">weighted_graph_check 决定是否以 v2 为主</text>
  <path class="bline" d="M480 286 V316 H300 V344"/><path class="gline" d="M720 286 V316 H900 V344"/>

  <rect class="box" x="60" y="346" width="500" height="200" rx="8" fill="#edf4f7" stroke="#6d98a7"/>
  <text class="head" x="84" y="380" fill="#315c6b">A · v1 主路径</text>
  <rect class="box" x="90" y="408" width="175" height="90" rx="6" fill="#fff" stroke="#8eabb5"/><text class="label" x="177" y="443" text-anchor="middle">解析模型</text><text class="small" x="177" y="472" text-anchor="middle">TypeSystem</text>
  <path class="bline" d="M265 453 H315"/>
  <rect class="box" x="320" y="408" width="210" height="90" rx="6" fill="#fff" stroke="#8eabb5"/><text class="label" x="425" y="443" text-anchor="middle">v1 Resolver</text><text class="small" x="425" y="472" text-anchor="middle">rewrite + tuple reads</text>

  <rect class="box" x="640" y="346" width="500" height="200" rx="8" fill="#edf4ef" stroke="#719887"/>
  <text class="head" x="664" y="380" fill="#3d6d5e">B · weighted-graph v2 主路径</text>
  <rect class="box" x="670" y="408" width="175" height="90" rx="6" fill="#fff" stroke="#94b2a2"/><text class="label" x="757" y="443" text-anchor="middle">解析关系图</text><text class="small" x="757" y="472" text-anchor="middle">Authorization graph</text>
  <path class="gline" d="M845 453 H895"/>
  <rect class="box" x="900" y="408" width="210" height="90" rx="6" fill="#fff" stroke="#94b2a2"/><text class="label" x="1005" y="443" text-anchor="middle">v2 求值</text><text class="small" x="1005" y="472" text-anchor="middle">edges + tuple reads</text>

  <path class="bline" d="M425 498 V590"/>
  <rect class="box" x="255" y="592" width="340" height="70" rx="8" fill="#e4eef2" stroke="#6d98a7"/>
  <text class="label" x="425" y="622" text-anchor="middle">v1 主求值成功</text><text class="small" x="425" y="647" text-anchor="middle">直接 v1 或 fallback 成功</text>

  <path class="line" d="M1005 498 V554"/>
  <rect class="box" x="830" y="556" width="350" height="70" rx="8" fill="#f1f4f5" stroke="#829195"/>
  <text class="label" x="1005" y="586" text-anchor="middle">v2 结果分类</text><text class="small" x="1005" y="611" text-anchor="middle">成功 / 终止错误 / 可回退错误</text>
  <path class="gline" d="M925 626 V652 H720 V680"/>
  <rect class="box" x="625" y="682" width="190" height="70" rx="8" fill="#e8f1eb" stroke="#719887"/>
  <text class="label" x="720" y="712" text-anchor="middle">v2 成功</text><text class="small" x="720" y="737" text-anchor="middle">直接返回 v2 结果</text>
  <path class="line" d="M1005 626 V680"/>
  <rect class="box" x="875" y="682" width="230" height="70" rx="8" fill="#f7eeeb" stroke="#bd8574"/>
  <text class="label" x="990" y="712" text-anchor="middle">终止错误</text><text class="small" x="990" y="737" text-anchor="middle">直接返回，不回退</text>

  <path class="bline" d="M1085 626 V774"/>
  <rect class="box" x="900" y="776" width="290" height="70" rx="8" fill="#edf4f7" stroke="#6d98a7"/>
  <text class="label" x="1045" y="806" text-anchor="middle">可回退错误</text><text class="small" x="1045" y="831" text-anchor="middle">改由 v1 resolver 求值</text>
  <path class="bline" d="M900 811 H620 V453 H532"/>

  <path class="line" d="M425 662 V716"/>
  <rect class="box" x="255" y="718" width="340" height="68" rx="8" fill="#eef2f2" stroke="#829195"/>
  <text class="label" x="425" y="747" text-anchor="middle">返回 v1 主结果</text><text class="small" x="425" y="772" text-anchor="middle">记录主路径指标</text>

  <path class="shadow" d="M595 640 H610 V870 H285 V898"/>
  <path class="shadow" d="M610 870 H855 V898"/>
  <circle class="shadow-joint" cx="595" cy="640" r="5"/>
  <rect class="box" x="100" y="900" width="370" height="82" rx="8" fill="#f7f3eb" stroke="#ad9470" stroke-dasharray="7 6"/>
  <text class="label" x="285" y="933" text-anchor="middle">shadow_check</text><text class="small" x="285" y="961" text-anchor="middle">比较两套 v1 resolver，不改主响应</text>
  <rect class="box" x="670" y="900" width="370" height="82" rx="8" fill="#f7f3eb" stroke="#ad9470" stroke-dasharray="7 6"/>
  <text class="label" x="855" y="933" text-anchor="middle">shadow_weighted_graph_check</text><text class="small" x="855" y="961" text-anchor="middle">v1 成功后异步对照 v2，不改主响应</text>
  <text class="small" x="600" y="1020" text-anchor="middle">虚线比较从 v1 成功处启动，与客户端返回是并行的后续工作</text>
  <text class="small" x="600" y="1050" text-anchor="middle">v2 直接成功与终止错误走各自返回分支，不进入 v1 shadow 路径</text>
</svg>
