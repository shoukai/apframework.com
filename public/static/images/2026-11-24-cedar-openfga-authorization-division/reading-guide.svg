<svg xmlns="http://www.w3.org/2000/svg" width="720" height="246" viewBox="0 0 720 246" role="img" aria-labelledby="t"><title id="t">金字塔式阅读路线</title><rect x="1" y="1" width="718" height="244" rx="15" fill="#f8fafc" stroke="#dbe4ed"/><g stroke="#a1aec0" stroke-width="1.5"><path d="M360 80v14m0 58v14"/><path d="m356 90 4 4 4-4m-8 72 4 4 4-4" fill="none"/></g><g stroke-width="1"><rect x="203" y="22" width="314" height="58" rx="8" fill="#e7f0fa" stroke="#b8cfe3"/><rect x="135" y="94" width="450" height="58" rx="8" fill="#eaf4f1" stroke="#bad8ce"/><rect x="67" y="166" width="586" height="58" rx="8" fill="#fff5e7" stroke="#ead8b9"/></g><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle" fill="#20324b"><g font-size="16" font-weight="600"><text x="360" y="46">结论：先划清职责</text><text x="360" y="118">比较：沿同一份文档走一遍</text><text x="360" y="190">取舍：用一次读取与一次撤权检验选型</text></g><g font-size="14" fill="#43576d"><text x="360" y="66">谁查关系，谁作判断，谁执行</text><text x="360" y="138">读取路径 · 请求输入 · 撤权与列举（§1–4）</text><text x="360" y="210">单用还是组合；同步、错误与审计由谁负责（§5–6）</text></g></g></svg>