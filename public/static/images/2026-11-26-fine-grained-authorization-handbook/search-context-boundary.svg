<svg xmlns="http://www.w3.org/2000/svg" width="680" height="275" viewBox="0 0 680 275" role="img" aria-labelledby="title desc"><title id="title">权限搜索和RAG的边界</title><desc id="desc">候选可来自全文搜索、可见ID过滤或派生授权索引，但片段必须在交给模型前授权。授权未知不可进入上下文。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#708795"/></marker></defs><rect width="680" height="275" rx="12" fill="#f7fafc"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#263c4a" font-size="14" text-anchor="middle"><g fill="#edf3fb" stroke="#bccfe4"><rect x="22" y="24" width="163" height="48" rx="7"/><rect x="22" y="111" width="163" height="48" rx="7"/><rect x="22" y="198" width="163" height="48" rx="7"/></g><text x="103" y="53">搜索 → 有序候选</text><text x="103" y="140">可见 ID → 受限搜索</text><text x="103" y="227">派生索引 → 候选</text><rect x="259" y="97" width="148" height="77" rx="8" fill="#eaf5f2" stroke="#b5d7cf"/><text x="333" y="125">当次授权检查</text><text x="333" y="150" font-size="12" fill="#526b7d">主体 + 文档 ID + read</text><rect x="489" y="97" width="166" height="77" rx="8" fill="#f1eef9" stroke="#ccbfdf"/><text x="572" y="125">组装模型上下文</text><text x="572" y="150" font-size="12" fill="#526b7d">仅放入获准的有效内容</text><rect x="269" y="211" width="128" height="36" rx="7" fill="#fff2ed" stroke="#e6c6b6"/><text x="333" y="234" font-size="12">拒绝 / 未知：不交付</text><text x="445" y="88" font-size="12" fill="#526b7d">允许</text><text x="478" y="208" font-size="12" fill="#526b7d">新扩展片段也必须经过此边界</text></g><g stroke="#708795" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M185 48H222V135H252"/><path d="M185 135H252"/><path d="M185 222H222V135"/><path d="M407 135H482"/><path d="M333 174V204"/></g></svg>