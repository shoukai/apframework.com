<svg xmlns="http://www.w3.org/2000/svg" width="680" height="288" viewBox="0 0 680 288" role="img" aria-labelledby="title desc"><title id="title">把授权绑定到那一次操作</title><desc id="desc">规范化请求、入队和执行使用同一份参数记录；写入前重授权，提交超时先查结果，不能用旧允许替代当前授权。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#708795"/></marker></defs><rect width="680" height="288" rx="12" fill="#f7fafc"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#263c4a" font-size="14" text-anchor="middle"><rect x="24" y="22" width="632" height="47" rx="8" fill="#fff" stroke="#cbd7de"/><text x="340" y="51">同一份操作记录：主体 · 动作 · 文档 · 目的地 · 审批引用 · 操作键</text><g fill="#edf3fb" stroke="#bccfe4"><rect x="24" y="108" width="128" height="66" rx="8"/><rect x="192" y="108" width="128" height="66" rx="8"/></g><text x="88" y="135">解析并核准</text><text x="88" y="157" font-size="12" fill="#526b7d">不采信模型自报资格</text><text x="256" y="135">排队保存请求</text><text x="256" y="157" font-size="12" fill="#526b7d">旧 Allow 不是通行证</text><rect x="360" y="108" width="128" height="66" rx="8" fill="#eaf5f2" stroke="#b5d7cf"/><text x="424" y="135">写入前再检查</text><text x="424" y="157" font-size="12" fill="#526b7d">当前权限与事实</text><rect x="528" y="108" width="128" height="66" rx="8" fill="#f1eef9" stroke="#ccbfdf"/><text x="592" y="135">按原参数提交</text><text x="592" y="157" font-size="12" fill="#526b7d">必要时条件写入</text><rect x="410" y="215" width="246" height="46" rx="8" fill="#fff2ed" stroke="#e6c6b6"/><text x="533" y="243" font-size="13">提交超时：先查原操作，再决定重放</text><text x="196" y="239" font-size="13" fill="#526b7d">重授权 ≠ 幂等 ≠ 执行成功</text></g><g stroke="#708795" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M152 141H185"/><path d="M320 141H353"/><path d="M488 141H521"/><path d="M592 174V208"/></g></svg>