<svg xmlns="http://www.w3.org/2000/svg" width="680" height="282" viewBox="0 0 680 282" role="img" aria-labelledby="title desc"><title id="title">授权变更与兼容回退</title><desc id="desc">扩展规则、迁移事实、验证中间态、切换调用方、最终清理。兼容期可以回切，清理旧元组后仅换回模型ID不能恢复状态。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#708795"/></marker></defs><rect width="680" height="282" rx="12" fill="#f7fafc"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#263c4a" font-size="14" text-anchor="middle"><g fill="#edf3fb" stroke="#bccfe4"><rect x="20" y="32" width="110" height="64" rx="8"/><rect x="152" y="32" width="110" height="64" rx="8"/><rect x="284" y="32" width="110" height="64" rx="8"/><rect x="416" y="32" width="110" height="64" rx="8"/></g><text x="75" y="58">扩展规则</text><text x="75" y="80" font-size="12" fill="#526b7d">保留旧路径</text><text x="207" y="58">迁移事实</text><text x="207" y="80" font-size="12" fill="#526b7d">回填与增量同步</text><text x="339" y="58">验证中间态</text><text x="339" y="80" font-size="12" fill="#526b7d">负例 · 不变项</text><text x="471" y="58">切换调用方</text><text x="471" y="80" font-size="12" fill="#526b7d">固定版本 · 灰度</text><rect x="548" y="32" width="110" height="64" rx="8" fill="#fff2ed" stroke="#e6c6b6"/><text x="603" y="58">最后清理</text><text x="603" y="80" font-size="12" fill="#526b7d">关闭兼容窗口</text><rect x="20" y="132" width="506" height="47" rx="8" fill="#eaf5f2" stroke="#b5d7cf"/><text x="273" y="160">兼容窗口：回切前核对旧代码、旧关系与索引仍可用</text><rect x="20" y="211" width="638" height="45" rx="8" fill="#fff" stroke="#cbd7de"/><text x="339" y="239" font-size="13">规则版本、关系数据、应用代码、派生索引：分别记录，协同恢复</text></g><g stroke="#708795" stroke-width="1.4" fill="none" marker-end="url(#a)"><path d="M130 64H146"/><path d="M262 64H278"/><path d="M394 64H410"/><path d="M526 64H542"/></g><path d="M538 118V183" stroke="#c99277" stroke-width="1.5" stroke-dasharray="4 4"/></svg>