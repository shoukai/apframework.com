<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img" aria-labelledby="title desc"><title id="title">一次授权的完整链路</title><desc id="desc">服务端从认证身份和规范化参数构造请求，以可信事实和规则求值，再执行决定和记录实际结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#708795"/></marker></defs><rect width="680" height="270" rx="12" fill="#f7fafc"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#263c4a" font-size="14" text-anchor="middle"><rect x="20" y="107" width="130" height="70" rx="8" fill="#edf3fb" stroke="#bccfe4"/><text x="85" y="133">身份与具体请求</text><text x="85" y="155" font-size="12" fill="#526b7d">谁 · 做什么 · 对什么</text><rect x="188" y="107" width="130" height="70" rx="8" fill="#eaf5f2" stroke="#b5d7cf"/><text x="253" y="133">准备可信输入</text><text x="253" y="155" font-size="12" fill="#526b7d">关系 · 属性 · 上下文</text><rect x="356" y="107" width="130" height="70" rx="8" fill="#edf3fb" stroke="#bccfe4"/><text x="421" y="133">按规则求值</text><text x="421" y="155" font-size="12" fill="#526b7d">决定 + 错误诊断</text><rect x="524" y="107" width="136" height="70" rx="8" fill="#f1eef9" stroke="#ccbfdf"/><text x="592" y="133">控制实际执行</text><text x="592" y="155" font-size="12" fill="#526b7d">返回内容或提交写入</text><rect x="188" y="24" width="298" height="47" rx="8" fill="#fff" stroke="#cbd7de"/><text x="337" y="53">规则版本与事实来源分别可追溯</text><text x="340" y="225" fill="#526b7d" font-size="13">调用成功不等于允许；得到允许不等于操作已经成功</text></g><g stroke="#708795" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M150 142H181"/><path d="M318 142H349"/><path d="M486 142H517"/><path d="M253 71V100"/><path d="M421 71V100"/></g></svg>