<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-labelledby="title desc"><title id="title">路线图的三条读取路径</title><desc id="desc">林岚通过本组织管理权读取，小陈通过研发组和文件夹继承读取，小周通过单份分享读取。模型明确声明后，这些事实才能推出读取。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#708795"/></marker></defs><rect width="680" height="320" rx="12" fill="#f7fafc"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#263c4a" text-anchor="middle"><g fill="#edf3fb" stroke="#bccfe4"><rect x="24" y="34" width="95" height="45" rx="7"/><rect x="24" y="132" width="95" height="45" rx="7"/><rect x="24" y="230" width="95" height="45" rx="7"/></g><text x="71" y="62">林岚</text><text x="71" y="160">小陈</text><text x="71" y="258">小周</text><g fill="#eaf5f2" stroke="#b5d7cf"><rect x="180" y="34" width="130" height="45" rx="7"/><rect x="180" y="132" width="130" height="45" rx="7"/><rect x="364" y="132" width="130" height="45" rx="7"/></g><text x="245" y="62">甲组织管理员</text><text x="245" y="160">研发组成员</text><text x="429" y="160">研发资料夹</text><rect x="548" y="111" width="108" height="85" rx="8" fill="#f1eef9" stroke="#ccbfdf"/><text x="602" y="147">项目路线图</text><text x="602" y="172" font-size="12" fill="#526b7d">read</text><g font-size="12" fill="#526b7d"><text x="148" y="45">admin</text><text x="148" y="143">member</text><text x="337" y="143">reader</text><text x="519" y="143">继承</text><text x="431" y="45">manage → read</text><text x="336" y="246">direct_reader：只分享这一份文档</text><text x="340" y="304">事实与推导分别维护；read 不反向推出 manage</text></g></g><g stroke="#708795" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M119 56H173"/><path d="M310 56H602V104"/><path d="M119 154H173"/><path d="M310 154H357"/><path d="M494 154H541"/><path d="M119 252H602V203"/></g></svg>