<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" role="img" aria-labelledby="title desc">
<title id="title">从遥测轨迹到行为评测</title><desc id="desc">测试运行中，OpenTelemetry 提供已采集的操作记录，测试用例定义行为预期，两者共同用于 Promptfoo 的测试判断。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#527381" stroke-width="1.5"/></marker></defs>
<rect width="760" height="252" fill="#fff"/>
<g font-family="system-ui, 'PingFang SC', sans-serif" fill="#203044" text-anchor="middle" font-size="14">
<rect x="40" y="24" width="278" height="79" rx="8" fill="#e8f2f7" stroke="#9dbbca"/>
<rect x="442" y="24" width="278" height="79" rx="8" fill="#eef5ee" stroke="#a7c4b0"/>
<text x="179" y="51" font-size="15" font-weight="600">OpenTelemetry：已采集的记录</text><text x="179" y="78">工具、参数或操作顺序</text>
<text x="581" y="51" font-size="15" font-weight="600">用例：事先定义的预期</text><text x="581" y="78">例如：确认后才允许建单</text>
<path d="M179 103V128H312V149M581 103V128H448V149" fill="none" stroke="#527381" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="217" y="151" width="326" height="62" rx="8" fill="#f4f6f8" stroke="#bdcad2"/>
<text x="380" y="175" font-size="15" font-weight="600">Promptfoo：用断言比对</text><text x="380" y="197">判断此次测试的记录是否满足预期</text>
<text x="380" y="238" font-size="13" fill="#4b6172">轨迹是输入，不是结论；评测也不替代业务核验。</text>
</g></svg>
