<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="title desc">
<title id="title">同样索引滞后，两种不同后果</title>
<desc id="desc">小周的项目路线图已撤权但仍被旧索引召回，返回前Check只有已看到撤权时才可剔除；产品计划刚被分享但未进入索引，因此不进入候选，Check不能凭空补回。复核也受授权链路新鲜度影响。</desc>
<defs><marker id="lag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60788b"/></marker></defs>
<rect width="680" height="380" fill="#ffffff"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#283e50">
<text x="340" y="29" text-anchor="middle" font-size="16" font-weight="600">小周的旧权限索引：一份多召回，一份没召回</text>
<text x="340" y="55" text-anchor="middle" font-size="15" fill="#627383">返回前 Check 只能处理实际进入候选的文档</text>
<text x="24" y="88" font-size="15">业务变化</text><text x="280" y="88" font-size="15">旧索引的候选</text><text x="494" y="88" font-size="15">返回前复核</text>
<rect x="24" y="104" width="204" height="90" rx="8" fill="#fff5e9" stroke="#dfc59e"/>
<rect x="266" y="104" width="180" height="90" rx="8" fill="#f2f6fa" stroke="#c1ced8"/>
<rect x="484" y="104" width="172" height="90" rx="8" fill="#edf7f1" stroke="#a9cbb7"/>
<g text-anchor="middle" font-size="16"><text x="126" y="132">《项目路线图》</text><text x="126" y="160">分享已撤销</text><text x="356" y="132">仍被召回</text><text x="356" y="160">候选里有它</text><text x="570" y="132">若已看到撤权</text><text x="570" y="160">拒绝 → 剔除</text></g>
<path d="M228 149H259" stroke="#60788b" stroke-width="1.5" fill="none" marker-end="url(#lag-arrow)"/><path d="M446 149H477" stroke="#60788b" stroke-width="1.5" fill="none" marker-end="url(#lag-arrow)"/>
<rect x="24" y="220" width="204" height="90" rx="8" fill="#f2f6fa" stroke="#c1ced8"/>
<rect x="266" y="220" width="180" height="90" rx="8" fill="#fff5e9" stroke="#dfc59e"/>
<rect x="484" y="220" width="172" height="90" rx="8" fill="#ffffff" stroke="#c1ced8" stroke-dasharray="4 4"/>
<g text-anchor="middle" font-size="16"><text x="126" y="248">《产品计划》</text><text x="126" y="276">刚分享给小周</text><text x="356" y="248">根本未召回</text><text x="356" y="276">候选里没有它</text><text x="570" y="248">没有这个 ID</text><text x="570" y="276">Check 补不回</text></g>
<path d="M228 265H259" stroke="#60788b" stroke-width="1.5" fill="none" marker-end="url(#lag-arrow)"/>
<path d="M446 265H477" stroke="#93a4b1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<g text-anchor="middle" font-size="15" fill="#627383"><text x="340" y="341">复核也受新鲜度影响：尚未看到撤权，就不能指望它剔除旧项</text><text x="340" y="367">案例示意，非实测；剔除后仍需补页，新授权漏召回另靠索引更新</text></g>
</g></svg>
