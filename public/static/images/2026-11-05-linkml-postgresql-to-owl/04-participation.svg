<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">林晓参与两个项目与项目负责人关系</title><desc id="desc">员工林晓参与项目101和项目102，两条 Participation 记录分别保存角色、投入比例和加入日期；项目owner陈晨和赵敏是独立于参与记录的关系。</desc>
