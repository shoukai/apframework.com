<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">LinkML required 与 OWL 全称限制和基数限制</title><desc id="desc">LinkML 中 Participation.employee required 且范围为 Employee，在 OWL 中拆解为 allValuesFrom 的范围约束和恰好一个的基数限制。全称约束只约束已有值的类型，存在性来自基数限制；都不等于关系数据库 NOT NULL 写入校验。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#54748b"/></marker><style>
.bg{fill:#fff}.title{font:700 26px sans-serif;fill:#172b3a}.sub{font:15px sans-serif;fill:#506575}.box{rx:10;stroke-width:1.5}.blue{fill:#edf5fb;stroke:#6e9fc2}.green{fill:#edf7f1;stroke:#70a78b}.amber{fill:#fff5e7;stroke:#d8a24d}.violet{fill:#f3f0fa;stroke:#9786bd}.txt{font:600 18px sans-serif;fill:#1d3343;text-anchor:middle}.small{font:14px sans-serif;fill:#415767;text-anchor:middle}.edge{fill:none;stroke:#54748b;stroke-width:2.2;marker-end:url(#a)}
</style></defs><rect class="bg" width="1200" height="470"/>
<text class="title" x="48" y="50">“必需”在 OWL 中要看不同公理各自表达什么</text><text class="sub" x="48" y="78">全称范围限制不负责让值出现；存在性来自另外的基数公理</text>
<rect class="box blue" x="55" y="151" width="300" height="132"/><text class="txt" x="205" y="190">LinkML slot</text><text class="small" x="205" y="222">Participation.employee</text><text class="small" x="205" y="250">range: Employee · required: true</text>
<path class="edge" d="M355 216H425"/>
<rect class="box violet" x="438" y="113" width="320" height="131"/><text class="txt" x="598" y="153">OWL 全称限制</text><text class="small" x="598" y="185">allValuesFrom Employee</text><text class="small" x="598" y="215">若存在 employee 值，则值属于 Employee</text>
<rect class="box green" x="438" y="268" width="320" height="131"/><text class="txt" x="598" y="309">OWL 基数限制</text><text class="small" x="598" y="341">cardinality = 1（非限定基数）</text><text class="small" x="598" y="371">要求恰好一个 employee 值</text>
<path class="edge" d="M758 179H816"/><path class="edge" d="M758 334H816"/>
<rect x="828" y="113" width="320" height="286" rx="10" fill="#f7f8f9" stroke="#cbd4da"/><text class="txt" x="988" y="157">范围 vs. 存在性</text><text class="small" x="988" y="199">allValuesFrom 单独存在时</text><text class="small" x="988" y="226">没有值也满足该范围陈述</text><line x1="865" y1="249" x2="1111" y2="249" stroke="#d9e2e7"/><text class="small" x="988" y="282">存在值的要求来自基数约束</text><text class="small" x="988" y="309">不是 allValuesFrom 自带的含义</text><text class="small" x="988" y="357">OWL 开放世界语义不等同 NOT NULL</text>
<rect x="155" y="338" width="228" height="64" rx="8" fill="#fff9ed" stroke="#edc47e"/><text class="small" x="269" y="365">实例缺值的报错与补齐</text><text class="small" x="269" y="388">应由数据 validator 执行</text>
<text class="small" x="600" y="444">结构/概念示意，非运行截图；OWL 公理不等于数据库写入校验</text></svg>