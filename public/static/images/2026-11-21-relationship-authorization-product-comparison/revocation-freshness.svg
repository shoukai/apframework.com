<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc">
  <title id="title">三种撤权后查询路径</title>
  <desc id="desc">Casbin 需要确认目标实例策略已刷新。OpenFGA 可使用 Higher Consistency 跳过相关缓存查数据库。SpiceDB 可把撤权返回的 ZedToken 作为查询新鲜度下界。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#748392"/></marker><style>
    text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#263746}.title{font-size:19px;font-weight:700}.label{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:12px}.box{fill:#fff;stroke:#cbd5dc;stroke-width:1.5}.cas{fill:#edf5f6;stroke:#8bb7b4}.fga{fill:#f1f5fb;stroke:#9db2cf}.spice{fill:#faf5e9;stroke:#d7c58f}.line{stroke:#748392;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style></defs>
  <rect width="680" height="390" fill="#fff"/><text x="28" y="36" class="title">撤权已写入后：下一次请求如何避免沿用旧状态？</text>
  <text x="32" y="82" class="label">Casbin</text><rect x="142" y="58" width="202" height="54" rx="8" class="box cas"/><text x="243" y="82" text-anchor="middle" class="body">更新策略存储</text><text x="243" y="101" text-anchor="middle" class="small">Watcher 通知 / 重载实例</text><path d="M344 85H408" class="line"/><rect x="414" y="58" width="224" height="54" rx="8" class="box cas"/><text x="526" y="82" text-anchor="middle" class="body">确认目标 Enforcer 已更新</text><text x="526" y="101" text-anchor="middle" class="small">由应用同步链路负责</text>
  <text x="32" y="174" class="label">OpenFGA</text><rect x="142" y="150" width="202" height="54" rx="8" class="box fga"/><text x="243" y="174" text-anchor="middle" class="body">HIGHER_CONSISTENCY</text><text x="243" y="193" text-anchor="middle" class="small">跳过相关缓存</text><path d="M344 177H408" class="line"/><rect x="414" y="150" width="224" height="54" rx="8" class="box fga"/><text x="526" y="174" text-anchor="middle" class="body">直接查询数据库</text><text x="526" y="193" text-anchor="middle" class="small">不是写入令牌下界</text>
  <text x="32" y="266" class="label">SpiceDB</text><rect x="142" y="242" width="202" height="54" rx="8" class="box spice"/><text x="243" y="266" text-anchor="middle" class="body">撤权返回 ZedToken</text><text x="243" y="285" text-anchor="middle" class="small">应用保存并随请求传递</text><path d="M344 269H408" class="line"/><rect x="414" y="242" width="224" height="54" rx="8" class="box spice"/><text x="526" y="266" text-anchor="middle" class="body">at_least_as_fresh(token)</text><text x="526" y="285" text-anchor="middle" class="small">求值不早于该修订点</text>
  <rect x="32" y="326" width="606" height="42" rx="6" fill="#f7f9fa" stroke="#dce3e8"/><text x="335" y="352" text-anchor="middle" class="small">页面缓存、搜索索引、已签发下载链接仍需应用分别失效或复核。</text>
</svg>
