<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#427785"/></marker></defs><rect width="1080" height="810" fill="#f5f8fa"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#243b48"><text x="40" y="48" font-size="27" font-weight="bold">项目参与记录：模型定义结构，实例给出具体值</text><text x="40" y="79" font-size="16" fill="#627783">教学示意 · 结构据本地模型整理，事实据合成种子数据核对 · 非 WebVOWL 截图</text><rect x="35" y="104" width="1010" height="290" rx="12" fill="#fff" stroke="#cad9df"/><text x="57" y="138" font-size="20" font-weight="bold">模型结构（类与属性）</text><g fill="#e8f3f4" stroke="#8ab0b7"><rect x="65" y="175" width="220" height="84" rx="10"/><rect x="420" y="175" width="240" height="84" rx="10"/><rect x="795" y="175" width="220" height="84" rx="10"/></g><g font-size="21" text-anchor="middle"><text x="175" y="210">Employee</text><text x="175" y="240">员工</text><text x="540" y="210">Participation</text><text x="540" y="240">项目参与记录</text><text x="905" y="210">Project</text><text x="905" y="240">项目</text></g><g stroke="#427785" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M418 218H289"/><path d="M662 218H791"/></g><g font-size="17" text-anchor="middle"><text x="352" y="198">employee</text><text x="727" y="198">project</text></g><text x="65" y="303" font-size="18">每次参与附有：role（角色）、allocation_pct（投入比例）</text><text x="65" y="336" font-size="18">joined_on（加入日期）、left_on（退出日期），以及独立的 id。</text><text x="65" y="370" font-size="16" fill="#627783">这里表示允许怎样描述参与；图中没有因此自动出现林晓或60%的业务事实。</text><rect x="35" y="415" width="1010" height="285" rx="12" fill="#fff" stroke="#cad9df"/><text x="57" y="451" font-size="20" font-weight="bold">实例事实（同一员工的两次参与）</text><g fill="#f0f4f7"><rect x="57" y="473" width="966" height="42" rx="5"/></g><g font-size="17"><text x="72" y="501">记录 / 员工</text><text x="285" y="501">项目</text><text x="540" y="501">角色 / 比例</text><text x="750" y="501">加入日期 / 退出日期</text><text x="72" y="550">1002 / 林晓</text><text x="285" y="550">101 设备知识平台</text><text x="540" y="550">engineer / 60%</text><text x="750" y="550">2026-01-01 / NULL</text><text x="72" y="601">1007 / 林晓</text><text x="285" y="601">102 客户数据治理</text><text x="540" y="601">engineer / 40%</text><text x="750" y="601">2026-05-01 / NULL</text></g><path d="M65 570H1015" stroke="#dbe3e8"/><text x="65" y="651" font-size="17">项目负责人：101为陈晨，102为赵敏。参与员工与项目负责人分别核对。</text><text x="65" y="680" font-size="15" fill="#627783">NULL是SQL种子数据的写法；RDF中未写退出日期。当前有效性仍需约定时间口径。</text><rect x="35" y="721" width="1010" height="60" rx="10" fill="#e6f1f1"/><text x="57" y="757" font-size="18">读结构：这条属性连接哪类对象？　对事实：哪条记录、谁、哪个项目、何时、多少？</text></g></svg>