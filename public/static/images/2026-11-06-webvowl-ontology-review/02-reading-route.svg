<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#467584"/></marker></defs><rect width="1000" height="620" rx="14" fill="#f5f8fa"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#243b48"><text x="44" y="55" font-size="28" font-weight="bold">从中文关系图到审查记录</text><text x="44" y="87" font-size="17" fill="#617581">教学阅读路线 · 由人逐项核对，不是工具自动验收流程</text><g fill="#fff" stroke="#cbd9df" stroke-width="2"><rect x="44" y="125" width="280" height="140" rx="12"/><rect x="360" y="125" width="280" height="140" rx="12"/><rect x="676" y="125" width="280" height="140" rx="12"/><rect x="676" y="320" width="280" height="140" rx="12"/><rect x="360" y="320" width="280" height="140" rx="12"/><rect x="44" y="320" width="280" height="140" rx="12"/></g><g font-size="22" font-weight="bold"><text x="64" y="163">1 认名称</text><text x="380" y="163">2 定身份</text><text x="696" y="163">3 读结构</text><text x="696" y="358">4 对事实</text><text x="380" y="358">5 查公理</text><text x="64" y="358">6 记结论</text></g><g font-size="17"><text x="64" y="200">中文标签帮助业务沟通</text><text x="64" y="230">同名不代表同一个对象</text><text x="380" y="200">用 URI 精确定位</text><text x="380" y="230">核对输入文件与版本</text><text x="696" y="200">先类与继承，再看关系</text><text x="696" y="230">核对方向及附属属性</text><text x="696" y="395">林晓的两条参与记录</text><text x="696" y="425">样本来自实例与种子数据</text><text x="380" y="395">回查 Turtle 中的限制</text><text x="380" y="425">范围、基数、映射与枚举</text><text x="64" y="395">已确认 / 需修改</text><text x="64" y="425">需业务澄清 / 尚未验证</text></g><g stroke="#467584" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M326 195H350"/><path d="M642 195H666"/><path d="M816 267V309"/><path d="M674 390H651"/><path d="M358 390H335"/></g><rect x="44" y="505" width="912" height="74" rx="10" fill="#e6f1f1"/><text x="66" y="537" font-size="19" font-weight="bold">每一项确认都留下：对象 URI、原始依据、实际表达、结论与复核方式。</text><text x="66" y="564" font-size="16">图形阅读、文件核对、业务确认、逻辑检查和实例校验分别记录。</text></g></svg>