<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title desc">
  <title id="title">Harness² 接入 DeerFlow 的独立进化服务方案</title>
  <desc id="desc">业务路由维持 DeerFlow 和 Octop 两个独立执行器；旁路进化服务由 Harness² 方法核心、DeerFlow 隔离实验 Worker、证据记录和独立回归发布门组成。运行证据反馈方法核心，通过回归的不可变版本用于后续 DeerFlow 生产任务。</desc>
  <defs>
    <style>
      text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#172033}
      .title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#475569}
      .lane{font-size:17px;font-weight:700}.boxTitle{font-size:19px;font-weight:700}
      .body{font-size:15px}.note{font-size:14px;fill:#475569}
      .box{stroke-width:2;rx:14}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrowhead)}
      .flow{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#purpleArrow)}
      .feedback{stroke:#7c3aed;stroke-width:2.4;stroke-dasharray:7 6;fill:none;marker-end:url(#purpleArrow)}
      .publish{stroke:#059669;stroke-width:2.8;stroke-dasharray:8 5;fill:none;marker-end:url(#greenArrow)}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#7c3aed"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#059669"/></marker>
  </defs>
  <rect width="1240" height="640" fill="#f8fafc"/>
  <text x="48" y="50" class="title">Harness² × DeerFlow：从旁路实验到受控发布</text>
  <text x="48" y="78" class="subtitle">本文工程方案。紫色为 Harness² 方法核心；蓝色为现有执行器；绿色为需要新增的生产门禁。</text>

  <rect x="48" y="108" width="1144" height="158" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="74" y="138" class="lane" fill="#1d4ed8">现有业务执行</text>
  <rect x="74" y="164" width="220" height="73" class="box" fill="#ffffff" stroke="#60a5fa"/>
  <text x="96" y="193" class="boxTitle">业务任务路由</text>
  <text x="96" y="219" class="body">根据任务选择执行器</text>
  <rect x="444" y="164" width="224" height="73" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="468" y="193" class="boxTitle">DeerFlow 生产执行</text>
  <text x="468" y="219" class="body">固定已发布版本</text>
  <rect x="847" y="164" width="224" height="73" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="878" y="193" class="boxTitle">Octop 生产执行</text>
  <text x="878" y="219" class="body">维持独立适配</text>
  <path d="M294 198 H438" class="arrow"/>
  <path d="M294 216 H365 V250 H805 V216 H841" class="arrow"/>

  <text x="74" y="313" class="lane" fill="#7c3aed">独立进化服务：先接 DeerFlow</text>
  <text x="845" y="313" class="note">任务快照与候选配置进入旁路实验</text>
  <rect x="48" y="330" width="1144" height="229" rx="20" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>

  <rect x="74" y="359" width="222" height="122" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="94" y="388" class="boxTitle">Harness² 方法核心</text>
  <text x="94" y="418" class="body">Propose–Probe–Compose</text>
  <text x="94" y="444" class="body">可执行组件与经验库</text>

  <rect x="355" y="359" width="222" height="122" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="374" y="388" class="boxTitle">DeerFlow 实验 Worker</text>
  <text x="374" y="418" class="body">快照 · 隔离 · 重跑</text>
  <text x="374" y="444" class="body">按候选版本实际加载</text>

  <rect x="636" y="359" width="222" height="122" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="658" y="388" class="boxTitle">执行证据</text>
  <text x="658" y="418" class="body">轨迹 · 交付物 · diff</text>
  <text x="658" y="444" class="body">实际加载哈希与用量</text>

  <rect x="917" y="359" width="222" height="122" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="939" y="388" class="boxTitle">独立回归与发布</text>
  <text x="939" y="418" class="body">未参与编辑的任务</text>
  <text x="939" y="444" class="body">不可变版本 · 回滚</text>

  <path d="M296 420 H349" class="flow"/>
  <path d="M577 420 H630" class="flow"/>
  <path d="M858 420 H911" class="arrow"/>
  <path d="M747 481 V523 H184 V487" class="feedback"/>
  <text x="315" y="546" class="note">运行证据回到下一次编辑与经验反思</text>
  <path d="M1028 359 V293 H556 V244" class="publish"/>
  <text x="620" y="281" class="note">通过回归的版本供后续生产任务使用</text>

  <text x="48" y="601" class="note">图中服务协议、Worker、回归和版本发布为本文建议；Octop 可在相同协议稳定后再增加适配器。</text>
</svg>
