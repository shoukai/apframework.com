<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">面向 Agent 的本体层工程链路</title>
  <desc id="desc">从任务问题出发，依次完成身份解析、带时间与来源的事实建模、受约束工具与执行层权限，最后用任务基线和运行指标验证并反馈治理。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526a70"/>
    </marker>
  </defs>
  <rect width="1200" height="390" fill="#f4f7f6"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#23383d">从业务问题到可验证的 Agent 工具</text>
  <text x="60" y="82" font-family="Arial, sans-serif" font-size="16" fill="#52666a">结构示意：每一步都为下一步提供可检查的输入</text>

  <g font-family="Arial, sans-serif">
    <rect x="55" y="130" width="185" height="145" rx="8" fill="#e7f1ed" stroke="#6b9b8b" stroke-width="2"/>
    <text x="75" y="165" font-size="17" font-weight="700" fill="#285d50">01 · 定义问题</text>
    <text x="75" y="198" font-size="15" fill="#263b3e">任务与正确答案</text>
    <text x="75" y="222" font-size="15" fill="#263b3e">决定需要哪些关系</text>
    <text x="75" y="252" font-size="13" fill="#5a6e70">先比较 SQL 等简单方案</text>

    <rect x="275" y="130" width="185" height="145" rx="8" fill="#edf2f4" stroke="#829ba5" stroke-width="2"/>
    <text x="295" y="165" font-size="17" font-weight="700" fill="#355b68">02 · 对齐身份</text>
    <text x="295" y="198" font-size="15" fill="#263b3e">保留源记录</text>
    <text x="295" y="222" font-size="15" fill="#263b3e">链接到规范实体</text>
    <text x="295" y="252" font-size="13" fill="#5a6e70">不确定匹配进入复核</text>

    <rect x="495" y="130" width="185" height="145" rx="8" fill="#f5f0e4" stroke="#b89a56" stroke-width="2"/>
    <text x="515" y="165" font-size="17" font-weight="700" fill="#725a22">03 · 记录事实</text>
    <text x="515" y="198" font-size="15" fill="#263b3e">来源、有效时间</text>
    <text x="515" y="222" font-size="15" fill="#263b3e">记录时间、认证状态</text>
    <text x="515" y="252" font-size="13" fill="#5a6e70">数值仍由权威源系统提供</text>

    <rect x="715" y="130" width="185" height="145" rx="8" fill="#f7ece8" stroke="#bd8574" stroke-width="2"/>
    <text x="735" y="165" font-size="17" font-weight="700" fill="#824b3b">04 · 约束调用</text>
    <text x="735" y="198" font-size="15" fill="#263b3e">窄工具、有限路径</text>
    <text x="735" y="222" font-size="15" fill="#263b3e">调用者身份参与授权</text>
    <text x="735" y="252" font-size="13" fill="#5a6e70">限制结果并返回出处</text>

    <rect x="935" y="130" width="210" height="145" rx="8" fill="#e9eef7" stroke="#8797b5" stroke-width="2"/>
    <text x="955" y="165" font-size="17" font-weight="700" fill="#455a7d">05 · 验证与治理</text>
    <text x="955" y="198" font-size="15" fill="#263b3e">与 SQL / 向量基线比较</text>
    <text x="955" y="222" font-size="15" fill="#263b3e">监测错误、陈旧与成本</text>
    <text x="955" y="252" font-size="13" fill="#5a6e70">变更回归，指定维护责任</text>
  </g>

  <g fill="none" stroke="#526a70" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M242 202 H268"/><path d="M462 202 H488"/><path d="M682 202 H708"/><path d="M902 202 H928"/>
  </g>
  <path d="M1040 290 C1040 342 150 342 150 290" fill="none" stroke="#6b8580" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="440" y="365" font-family="Arial, sans-serif" font-size="15" fill="#52666a">运行结果与数据变化反馈到任务集、映射和模型变更</text>
</svg>