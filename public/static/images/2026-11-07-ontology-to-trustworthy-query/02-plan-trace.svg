<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-label="Q03：从业务提问到四名参与者"><title>Q03：从业务提问到四名参与者</title><style>text{font-family:sans-serif;text-anchor:middle;fill:#17324d}.node{fill:#edf5fc;stroke:#507c9e;stroke-width:1.5}.green{fill:#edf7f0;stroke:#4f8061;stroke-width:1.5}.amber{fill:#fff5df;stroke:#b58832;stroke-width:1.5}.edge{fill:none;stroke:#56738a;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738a"/></marker></defs><rect width="1000" height="530" fill="#fff"/><text x="500" y="38" font-size="24" font-weight="700">Q03：从业务提问到四名参与者</text><g><rect class="node" x="210" y="68" width="580" height="62" rx="12"/><text x="500" y="99" dominant-baseline="middle" font-size="16">谁当前参与远山正在进行的项目？</text></g><path class="edge" d="M500 140 L500 170"/><g><rect class="node" x="100" y="184" width="800" height="78" rx="12"/><text x="500" y="211.8" dominant-baseline="middle" font-size="16">远山 → 客户1；参与 → Participation.employee</text><text x="500" y="234.2" dominant-baseline="middle" font-size="16">active项目；参考日2026-11-03；员工ID去重</text></g><path class="edge" d="M500 272 L500 302"/><g><rect class="green" x="100" y="316" width="370" height="76" rx="12"/><text x="285" y="342.8" dominant-baseline="middle" font-size="16">计划选择白名单模板</text><text x="285" y="365.2" dominant-baseline="middle" font-size="16">SQL结构由程序维护</text></g><g><rect class="amber" x="530" y="316" width="370" height="76" rx="12"/><text x="715" y="342.8" dominant-baseline="middle" font-size="16">值参数独立绑定</text><text x="715" y="365.2" dominant-baseline="middle" font-size="16">客户1、active、两个参考日</text></g><path class="edge" d="M285 402 L430 438"/><path class="edge" d="M715 402 L570 438"/><g><rect class="green" x="220" y="452" width="560" height="58" rx="12"/><text x="500" y="481" dominant-baseline="middle" font-size="16">结果：陈晨、林晓、王宁、周宇</text></g></svg>
