<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">“负责”可能走向三条不同关系</title><desc id="desc">模糊提问会分叉为项目负责人、项目参与者和任务执行人三种查询关系，需要先澄清。</desc><style>text{font-family:sans-serif;text-anchor:middle;fill:#17324d}.node{fill:#edf5fc;stroke:#507c9e;stroke-width:1.5}.green{fill:#edf7f0;stroke:#4f8061;stroke-width:1.5}.amber{fill:#fff5df;stroke:#b58832;stroke-width:1.5}.edge{fill:none;stroke:#56738a;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738a"/></marker></defs><rect width="1000" height="470" fill="#fff"/><text x="500" y="40" font-size="24" font-weight="700">“负责”可能走向三条不同关系</text><g><rect class="amber" x="210" y="72" width="580" height="66" rx="12"/><text x="500" y="93.8" dominant-baseline="middle" font-size="16">“林晓负责远山那边吗？”</text><text x="500" y="116.2" dominant-baseline="middle" font-size="16">还没说清关系，也没指定具体项目</text></g><path class="edge" d="M500 142 L500 174 M500 174 L165 224 M500 174 L500 224 M500 174 L835 224"/><g><rect class="green" x="40" y="240" width="290" height="128" rx="12"/><text x="185" y="281.6" dominant-baseline="middle" font-size="16">项目 → Project.owner</text><text x="185" y="304" dominant-baseline="middle" font-size="16">项目负责人</text><text x="185" y="326.4" dominant-baseline="middle" font-size="16">问：谁对项目负有负责人角色？</text></g><g><rect class="node" x="355" y="240" width="290" height="128" rx="12"/><text x="500" y="281.6" dominant-baseline="middle" font-size="16">项目 → Participation.employee</text><text x="500" y="304" dominant-baseline="middle" font-size="16">项目参与者</text><text x="500" y="326.4" dominant-baseline="middle" font-size="16">问：哪些员工有参与记录？</text></g><g><rect class="amber" x="670" y="240" width="290" height="128" rx="12"/><text x="815" y="281.6" dominant-baseline="middle" font-size="16">任务 → Task.assignee</text><text x="815" y="304" dominant-baseline="middle" font-size="16">任务执行人</text><text x="815" y="326.4" dominant-baseline="middle" font-size="16">问：谁承接了具体任务？</text></g><text x="500" y="415" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#8a4f31" font-weight="700">关系选错时，查询仍可能返回真实的人，却回答了另一道题。</text></svg>
