<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="结束日边界变更：定义、回归与发布"><title>结束日边界变更：定义、回归与发布</title><style>text{font-family:sans-serif;text-anchor:middle;fill:#17324d}.node{fill:#edf5fc;stroke:#507c9e;stroke-width:1.5}.green{fill:#edf7f0;stroke:#4f8061;stroke-width:1.5}.amber{fill:#fff5df;stroke:#b58832;stroke-width:1.5}.edge{fill:none;stroke:#56738a;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738a"/></marker></defs><rect width="1000" height="440" fill="#fff"/><text x="500" y="38" font-size="24" font-weight="700">结束日边界变更：定义、回归与发布</text><g><rect class="amber" x="50" y="76" width="250" height="80" rx="12"/><text x="175" y="104.8" dominant-baseline="middle" font-size="16">提出v2候选</text><text x="175" y="127.2" dominant-baseline="middle" font-size="16">结束日由 ≥ 改为 &gt;</text></g><g><rect class="node" x="375" y="76" width="250" height="80" rx="12"/><text x="500" y="104.8" dominant-baseline="middle" font-size="16">审核定义与映射</text><text x="500" y="127.2" dominant-baseline="middle" font-size="16">保留生效与追溯决定</text></g><g><rect class="green" x="700" y="76" width="250" height="80" rx="12"/><text x="825" y="104.8" dominant-baseline="middle" font-size="16">执行边界回归</text><text x="825" y="127.2" dominant-baseline="middle" font-size="16">核对影响与非影响项</text></g><path class="edge" d="M310 116 L361 116"/><path class="edge" d="M635 116 L686 116"/><path class="edge" d="M825 166 L825 212"/><g><rect class="green" x="520" y="226" width="430" height="86" rx="12"/><text x="735" y="257.8" dominant-baseline="middle" font-size="16">参考日：2026-11-03</text><text x="735" y="280.2" dominant-baseline="middle" font-size="16">结束日等于参考日：v1保留，v2排除</text></g><g><rect class="amber" x="50" y="226" width="390" height="86" rx="12"/><text x="245" y="257.8" dominant-baseline="middle" font-size="16">测试通过 ≠ 审批通过</text><text x="245" y="280.2" dominant-baseline="middle" font-size="16">批准后绑定版本发布；保留回退</text></g><path class="edge" d="M510 269 L454 269"/><g><rect class="node" x="150" y="350" width="700" height="58" rx="12"/><text x="500" y="379" dominant-baseline="middle" font-size="16">其他边界不变：开放结束保留，未来开始排除</text></g></svg>
