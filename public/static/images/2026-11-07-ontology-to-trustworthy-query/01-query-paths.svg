<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="同一组业务事实，两条查询路径"><title>同一组业务事实，两条查询路径</title><style>text{font-family:sans-serif;text-anchor:middle;fill:#17324d}.node{fill:#edf5fc;stroke:#507c9e;stroke-width:1.5}.green{fill:#edf7f0;stroke:#4f8061;stroke-width:1.5}.amber{fill:#fff5df;stroke:#b58832;stroke-width:1.5}.edge{fill:none;stroke:#56738a;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738a"/></marker></defs><rect width="1000" height="440" fill="#fff"/><text x="500" y="38" font-size="24" font-weight="700">同一组业务事实，两条查询路径</text><g><rect class="node" x="350" y="70" width="300" height="72" rx="12"/><text x="500" y="106" dominant-baseline="middle" font-size="16">业务对象、关系与时间口径</text></g><path class="edge" d="M410 152 L260 192"/><path class="edge" d="M590 152 L740 192"/><g><rect class="green" x="70" y="206" width="380" height="78" rx="12"/><text x="260" y="233.8" dominant-baseline="middle" font-size="16">关系库中的权威事实</text><text x="260" y="256.2" dominant-baseline="middle" font-size="16">语义计划 → 受控SQL</text></g><g><rect class="node" x="550" y="206" width="380" height="78" rx="12"/><text x="740" y="233.8" dominant-baseline="middle" font-size="16">RDF实例快照</text><text x="740" y="256.2" dominant-baseline="middle" font-size="16">抽取与对齐 → Fuseki / TDB2</text></g><path class="edge" d="M260 294 L260 328"/><path class="edge" d="M740 294 L740 328"/><g><rect class="green" x="70" y="342" width="380" height="60" rx="12"/><text x="260" y="372" dominant-baseline="middle" font-size="16">绑定参数，按参考日查询</text></g><g><rect class="node" x="550" y="342" width="380" height="60" rx="12"/><text x="740" y="372" dominant-baseline="middle" font-size="16">SPARQL匹配；刷新需独立管理</text></g></svg>
