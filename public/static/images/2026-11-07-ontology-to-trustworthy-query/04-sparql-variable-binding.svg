<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">同名变量把两条参与记录连到林晓</title><desc id="desc">SPARQL重复出现的员工变量必须匹配同一个RDF资源；参与记录1002与1007均指向员工2。</desc><style>text{font-family:sans-serif;text-anchor:middle;fill:#17324d}.node{fill:#edf5fc;stroke:#507c9e;stroke-width:1.5}.green{fill:#edf7f0;stroke:#4f8061;stroke-width:1.5}.amber{fill:#fff5df;stroke:#b58832;stroke-width:1.5}.edge{fill:none;stroke:#56738a;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738a"/></marker></defs><rect width="1000" height="500" fill="#fff"/><text x="500" y="40" font-size="24" font-weight="700">同名变量把两条参与记录连到林晓</text><text x="500" y="78" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#276b79" font-weight="700">匹配模式中的同一个 ?员工，是连接键，不是姓名文本</text><path class="edge" d="M310 170 L375 230"/><path class="edge" d="M310 365 L375 295"/><g><rect class="node" x="55" y="120" width="250" height="102" rx="12"/><text x="180" y="159.8" dominant-baseline="middle" font-size="16">参与记录 1002</text><text x="180" y="182.2" dominant-baseline="middle" font-size="16">ex:employee → ?员工</text></g><g><rect class="node" x="55" y="315" width="250" height="102" rx="12"/><text x="180" y="354.8" dominant-baseline="middle" font-size="16">参与记录 1007</text><text x="180" y="377.2" dominant-baseline="middle" font-size="16">ex:employee → ?员工</text></g><g><rect class="green" x="380" y="205" width="250" height="112" rx="12"/><text x="505" y="249.8" dominant-baseline="middle" font-size="16">员工资源 employee/2</text><text x="505" y="272.2" dominant-baseline="middle" font-size="16">林晓 · ex:Employee</text></g><g><rect class="amber" x="690" y="120" width="265" height="102" rx="12"/><text x="822.5" y="159.8" dominant-baseline="middle" font-size="16">记录1002对应项目</text><text x="822.5" y="182.2" dominant-baseline="middle" font-size="16">设备知识平台 · 投入60%</text></g><g><rect class="amber" x="690" y="315" width="265" height="102" rx="12"/><text x="822.5" y="354.8" dominant-baseline="middle" font-size="16">记录1007对应项目</text><text x="822.5" y="377.2" dominant-baseline="middle" font-size="16">客户数据治理 · 投入40%</text></g><text x="350" y="190" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#476174" font-weight="400">同一绑定</text><text x="350" y="345" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#476174" font-weight="400">同一绑定</text><text x="500" y="465" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#276b79" font-weight="700">同一员工可有多条参与记录；记录数不等于去重后的员工数</text></svg>
