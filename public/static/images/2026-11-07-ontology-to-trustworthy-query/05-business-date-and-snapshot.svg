<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">业务参考日与数据快照，是两只不同的时钟</title><desc id="desc">上轨选择要判断哪一天的业务有效状态；下轨标识查询所依据的数据版本。案例未提供实测快照时间。</desc><style>text{font-family:sans-serif;text-anchor:middle;fill:#17324d}.node{fill:#edf5fc;stroke:#507c9e;stroke-width:1.5}.green{fill:#edf7f0;stroke:#4f8061;stroke-width:1.5}.amber{fill:#fff5df;stroke:#b58832;stroke-width:1.5}.edge{fill:none;stroke:#56738a;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738a"/></marker></defs><rect width="1000" height="500" fill="#fff"/><text x="500" y="40" font-size="24" font-weight="700">业务参考日与数据快照，是两只不同的时钟</text><text x="90" y="105" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#276b79" font-weight="700">业务时间</text><text x="260" y="105" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#476174" font-weight="400">要判断哪一天有效？</text><line x1="170" y1="170" x2="900" y2="170" stroke="#6b8797" stroke-width="3"/><rect x="240" y="145" width="510" height="50" rx="25" fill="#edf7f0" stroke="#4f8061" stroke-width="1.5"/><text x="495" y="170" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#315d42" font-weight="600">参与有效期（按本例的起止日规则判断）</text><line x1="650" y1="128" x2="650" y2="215" stroke="#b58832" stroke-width="3"/><circle cx="650" cy="170" r="8" fill="#b58832"/><text x="650" y="232" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#8a641d" font-weight="700">参考业务日：2026-11-03</text><text x="90" y="315" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#276b79" font-weight="700">数据时间</text><text x="290" y="315" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#476174" font-weight="400">查询时实际看得到哪一批事实？</text><line x1="170" y1="370" x2="900" y2="370" stroke="#6b8797" stroke-width="3"/><circle cx="650" cy="370" r="11" fill="#fff5df" stroke="#b58832" stroke-width="3"/><text x="650" y="405" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#8a641d" font-weight="700">快照 / 抽取时刻 S</text><text x="650" y="435" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#6a7780" font-weight="400">S仅作符号示意；本案例未提供实测快照时间</text><g><rect class="node" x="230" y="455" width="720" height="32" rx="12"/><text x="590" y="471" dominant-baseline="middle" font-size="16">可复算答案 = 快照 S 中可见的事实 × 参考日的业务规则</text></g></svg>
