<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">三种数据访问路线：接口、事实位置与维护责任</title><desc id="desc">比较语义辅助SQL、虚拟知识图谱和物化RDF的查询链、事实位置、复制方式与维护重点。</desc><style>text{font-family:sans-serif;text-anchor:middle;fill:#17324d}.node{fill:#edf5fc;stroke:#507c9e;stroke-width:1.5}.green{fill:#edf7f0;stroke:#4f8061;stroke-width:1.5}.amber{fill:#fff5df;stroke:#b58832;stroke-width:1.5}.edge{fill:none;stroke:#56738a;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738a"/></marker></defs><rect width="1000" height="520" fill="#fff"/><text x="500" y="40" font-size="24" font-weight="700">三种数据访问路线：接口、事实位置与维护责任</text><text x="500" y="76" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#276b79" font-weight="700">选择差异不在“有没有语义”，而在查询如何到达权威事实</text><g><rect class="green" x="35" y="105" width="295" height="72" rx="12"/><text x="182.5" y="129.8" dominant-baseline="middle" font-size="16">语义辅助 SQL</text><text x="182.5" y="152.2" dominant-baseline="middle" font-size="16">问题 → 计划 → 受控SQL</text></g><g><rect class="node" x="352" y="105" width="295" height="72" rx="12"/><text x="499.5" y="129.8" dominant-baseline="middle" font-size="16">虚拟知识图谱</text><text x="499.5" y="152.2" dominant-baseline="middle" font-size="16">SPARQL → 映射改写 → 源库SQL</text></g><g><rect class="amber" x="670" y="105" width="295" height="72" rx="12"/><text x="817.5" y="129.8" dominant-baseline="middle" font-size="16">物化 RDF</text><text x="817.5" y="152.2" dominant-baseline="middle" font-size="16">抽取转换 → RDF存储 → SPARQL</text></g><g><rect class="green" x="35" y="195" width="295" height="82" rx="12"/><text x="182.5" y="213.6" dominant-baseline="middle" font-size="16">事实位置：关系库</text><text x="182.5" y="236" dominant-baseline="middle" font-size="16">复制：无需完整RDF副本</text><text x="182.5" y="258.4" dominant-baseline="middle" font-size="16">接口：SQL模板</text></g><g><rect class="node" x="352" y="195" width="295" height="82" rx="12"/><text x="499.5" y="213.6" dominant-baseline="middle" font-size="16">事实位置：关系库仍为权威</text><text x="499.5" y="236" dominant-baseline="middle" font-size="16">复制：通常不物化完整实例图</text><text x="499.5" y="258.4" dominant-baseline="middle" font-size="16">接口：SPARQL映射到SQL</text></g><g><rect class="amber" x="670" y="195" width="295" height="82" rx="12"/><text x="817.5" y="213.6" dominant-baseline="middle" font-size="16">事实位置：RDF数据集快照</text><text x="817.5" y="236" dominant-baseline="middle" font-size="16">复制：保存实例副本</text><text x="817.5" y="258.4" dominant-baseline="middle" font-size="16">接口：图模式与SPARQL</text></g><g><rect class="green" x="35" y="300" width="295" height="150" rx="12"/><text x="182.5" y="341.4" dominant-baseline="middle" font-size="16">适合评估</text><text x="182.5" y="363.8" dominant-baseline="middle" font-size="16">关系与聚合稳定，复用现有库</text><text x="182.5" y="386.2" dominant-baseline="middle" font-size="16">主要维护</text><text x="182.5" y="408.6" dominant-baseline="middle" font-size="16">别名、关系映射、模板与权限</text></g><g><rect class="node" x="352" y="300" width="295" height="150" rx="12"/><text x="499.5" y="341.4" dominant-baseline="middle" font-size="16">适合评估</text><text x="499.5" y="363.8" dominant-baseline="middle" font-size="16">需要RDF接口，源库仍是权威</text><text x="499.5" y="386.2" dominant-baseline="middle" font-size="16">主要维护</text><text x="499.5" y="408.6" dominant-baseline="middle" font-size="16">映射规则、查询改写与运行依赖</text></g><g><rect class="amber" x="670" y="300" width="295" height="150" rx="12"/><text x="817.5" y="341.4" dominant-baseline="middle" font-size="16">适合评估</text><text x="817.5" y="363.8" dominant-baseline="middle" font-size="16">图遍历、跨源连接或RDF交换</text><text x="817.5" y="386.2" dominant-baseline="middle" font-size="16">主要维护</text><text x="817.5" y="408.6" dominant-baseline="middle" font-size="16">刷新、删除传播、版本与对账</text></g><text x="500" y="490" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#687781" font-weight="400">本图比较职责与代价，不代表本案例完成了三路性能测试。</text></svg>
