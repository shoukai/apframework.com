<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">OpenFGA local benchmark design</title>
  <desc id="desc">The local benchmark fixes service version, storage, resources, and the authorization request; varies concurrency, relationship count, and inheritance depth; records latency percentiles, request rate, errors, and isolated resource snapshots; results describe only this local single-run setup.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#718087" />
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="10" fill="#ffffff" stroke="#d9e3e5" stroke-width="2" />
  <text x="42" y="48" fill="#1f2933" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="650">性能实验：固定什么，改变什么，记录什么</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="42" y="82" width="250" height="230" rx="8" fill="#f5f9f8" stroke="#cbdcda" stroke-width="2" />
    <text x="64" y="118" fill="#245e62" font-size="19" font-weight="700">固定条件</text>
    <text x="64" y="158" fill="#1f2933" font-size="17">OpenFGA v1.22.1</text>
    <text x="64" y="190" fill="#1f2933" font-size="17">memory datastore</text>
    <text x="64" y="222" fill="#1f2933" font-size="17">Alice 检查 Roadmap</text>
    <text x="64" y="254" fill="#1f2933" font-size="17">4 CPU / 8 GiB 容器</text>
    <text x="64" y="286" fill="#53616a" font-size="15">本机 HTTP 请求</text>

    <line x1="304" y1="196" x2="337" y2="196" stroke="#718087" stroke-width="3" marker-end="url(#arrow)" />

    <rect x="350" y="82" width="280" height="230" rx="8" fill="#f8f7f1" stroke="#e5ddc7" stroke-width="2" />
    <text x="374" y="118" fill="#8b642e" font-size="19" font-weight="700">改变的变量</text>
    <text x="374" y="160" fill="#1f2933" font-size="17">并发：1 / 16 / 32</text>
    <text x="374" y="198" fill="#1f2933" font-size="17">关系数：1,003 / 10,003</text>
    <text x="374" y="236" fill="#1f2933" font-size="17">继承深度：1 / 5 / 10</text>
    <text x="374" y="278" fill="#53616a" font-size="15">每种设置只运行一次</text>

    <line x1="642" y1="196" x2="675" y2="196" stroke="#718087" stroke-width="3" marker-end="url(#arrow)" />

    <rect x="688" y="82" width="230" height="230" rx="8" fill="#f4f7fb" stroke="#d2ddec" stroke-width="2" />
    <text x="712" y="118" fill="#45658f" font-size="19" font-weight="700">记录的结果</text>
    <text x="712" y="160" fill="#1f2933" font-size="17">p50 / p95 / p99</text>
    <text x="712" y="198" fill="#1f2933" font-size="17">完成请求速率</text>
    <text x="712" y="236" fill="#1f2933" font-size="17">错误 / 意外拒绝</text>
    <text x="712" y="278" fill="#53616a" font-size="15">资源仅有快照</text>

    <line x1="930" y1="196" x2="963" y2="196" stroke="#718087" stroke-width="3" marker-end="url(#arrow)" />

    <rect x="976" y="82" width="182" height="230" rx="8" fill="#fbf4f1" stroke="#ead4ca" stroke-width="2" />
    <text x="998" y="118" fill="#9b573c" font-size="19" font-weight="700">结论边界</text>
    <text x="998" y="160" fill="#1f2933" font-size="16">单机</text>
    <text x="998" y="194" fill="#1f2933" font-size="16">单次</text>
    <text x="998" y="228" fill="#1f2933" font-size="16">合成数据</text>
    <text x="998" y="274" fill="#9b573c" font-size="16" font-weight="650">不是生产容量</text>
  </g>
  <text x="42" y="360" fill="#53616a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">这组实验用于观察指定本机配置中的变化；没有重复样本、数据库对照或生产网络数据。</text>
  <text x="42" y="394" fill="#53616a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">资源数值来自独立快照，不能解释为基准期间的峰值或单次请求的资源消耗。</text>
</svg>
