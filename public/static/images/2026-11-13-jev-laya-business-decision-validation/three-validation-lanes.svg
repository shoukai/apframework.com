<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img"><title>工程性能、接口可靠与业务正确分别验证</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="310" rx="20" fill="#ffffff"/><rect x="30" y="35" width="340" height="240" rx="16" fill="#eaf2ff" stroke="#cbd5e1"/><text x="200.0" y="73" text-anchor="middle" dominant-baseline="middle" font-size="25" font-weight="700" fill="#172b4d">工程性能</text><text x="200.0" y="118" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">延迟 / 吞吐</text><text x="200.0" y="152" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">内存 / 冷启动</text><text x="200.0" y="186" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">衡量运行效率</text><rect x="430" y="35" width="340" height="240" rx="16" fill="#e7f6f4" stroke="#cbd5e1"/><text x="600.0" y="73" text-anchor="middle" dominant-baseline="middle" font-size="25" font-weight="700" fill="#172b4d">接口可靠</text><text x="600.0" y="118" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">结构 / 错误处理</text><text x="600.0" y="152" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">版本 / 输入截断</text><text x="600.0" y="186" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">衡量接入稳定性</text><rect x="830" y="35" width="340" height="240" rx="16" fill="#fff3df" stroke="#cbd5e1"/><text x="1000.0" y="73" text-anchor="middle" dominant-baseline="middle" font-size="25" font-weight="700" fill="#172b4d">业务正确</text><text x="1000.0" y="118" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">精确率 / 召回率</text><text x="1000.0" y="152" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">风险漏判 / 人工改判</text><text x="1000.0" y="186" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400" fill="#334155">衡量业务适配</text></g></svg>