<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="100%" height="100%">
<style>text { font-family: "JetBrains Mono", "Courier New", monospace; }</style>

        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#020617"/>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- Purpose Layer (top) -->
        <rect x="280" y="30" width="300" height="70" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="2"/>
        <text x="430" y="58" fill="white" font-size="16" font-weight="700" text-anchor="middle">Purpose（意图）</text>
        <text x="430" y="80" fill="#fb7185" font-size="11" text-anchor="middle">为什么做 · 为谁做 · 边界内做</text>

        <!-- Arrow Purpose → Wisdom -->
        <line x1="430" y1="100" x2="430" y2="125" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Wisdom Layer -->
        <rect x="220" y="130" width="420" height="70" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
        <text x="430" y="158" fill="white" font-size="16" font-weight="700" text-anchor="middle">Wisdom（智慧）</text>
        <text x="430" y="180" fill="#34d399" font-size="11" text-anchor="middle">规划 · 权衡 · 执行 · 反思</text>

        <!-- Arrow Wisdom → Knowledge -->
        <line x1="430" y1="200" x2="430" y2="225" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Knowledge Layer -->
        <rect x="170" y="230" width="520" height="70" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="2"/>
        <text x="430" y="258" fill="white" font-size="16" font-weight="700" text-anchor="middle">Knowledge（知识）</text>
        <text x="430" y="280" fill="#a78bfa" font-size="11" text-anchor="middle">规则 · 流程 · 术语 · SOP · 业务模型</text>

        <!-- Arrow Knowledge → Information -->
        <line x1="430" y1="300" x2="430" y2="325" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Information Layer -->
        <rect x="120" y="330" width="620" height="70" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="430" y="358" fill="white" font-size="16" font-weight="700" text-anchor="middle">Information（信息）</text>
        <text x="430" y="380" fill="#22d3ee" font-size="11" text-anchor="middle">上下文 · 关联 · 清洗 · 解释</text>

        <!-- Arrow Information → Data -->
        <line x1="430" y1="400" x2="430" y2="425" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Data Layer (bottom) -->
        <rect x="50" y="430" width="760" height="70" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
        <text x="430" y="458" fill="white" font-size="16" font-weight="700" text-anchor="middle">Data（数据）</text>
        <text x="430" y="480" fill="#fbbf24" font-size="11" text-anchor="middle">原始数据 · 系统连接 · 工具接入 · 事件流</text>

        <!-- Legend -->
        <text x="700" y="530" fill="#94a3b8" font-size="9" text-anchor="end">每一层宽度递增，代表对下层数据的依赖和治理范围扩大</text>

        <!-- Side labels -->
        <text x="20" y="70" fill="#94a3b8" font-size="9" writing-mode="tb" text-anchor="middle">控制平面</text>
        <text x="20" y="400" fill="#94a3b8" font-size="9" writing-mode="tb" text-anchor="middle">数据平面</text>
      </svg>