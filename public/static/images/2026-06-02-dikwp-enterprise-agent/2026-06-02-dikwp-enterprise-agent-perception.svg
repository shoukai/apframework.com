<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
<style>text { font-family: "JetBrains Mono", "Courier New", monospace; }</style>

        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
          <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#020617"/>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- Enterprise Data Sources -->
        <text x="30" y="40" fill="#94a3b8" font-size="11" font-weight="600">企业数据源</text>
        <rect x="30" y="55" width="120" height="45" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="90" y="73" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">CRM / ERP</text>
        <text x="90" y="88" fill="#94a3b8" font-size="8" text-anchor="middle">业务系统</text>

        <rect x="30" y="115" width="120" height="45" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="90" y="133" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">数仓 / 湖仓</text>
        <text x="90" y="148" fill="#94a3b8" font-size="8" text-anchor="middle">Databricks/SNOW</text>

        <rect x="30" y="175" width="120" height="45" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="90" y="193" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">OA / 工单</text>
        <text x="90" y="208" fill="#94a3b8" font-size="8" text-anchor="middle">流程数据</text>

        <rect x="30" y="235" width="120" height="45" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="90" y="253" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">BI / 日志</text>
        <text x="90" y="268" fill="#94a3b8" font-size="8" text-anchor="middle">分析平台</text>

        <rect x="30" y="295" width="120" height="45" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="90" y="313" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">Kafka / Flink</text>
        <text x="90" y="328" fill="#94a3b8" font-size="8" text-anchor="middle">实时事件流</text>

        <!-- Arrows from sources to gateway -->
        <line x1="150" y1="77" x2="215" y2="77" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="150" y1="137" x2="215" y2="137" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="150" y1="197" x2="215" y2="197" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="150" y1="257" x2="215" y2="257" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="150" y1="317" x2="215" y2="317" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- CDC/ETL pipeline -->
        <text x="165" y="365" fill="#94a3b8" font-size="8" text-anchor="middle">CDC / ETL/ELT</text>

        <!-- API Gateway + MCP Server (central hub) -->
        <rect x="220" y="70" width="180" height="120" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="2"/>
        <text x="310" y="100" fill="white" font-size="13" font-weight="600" text-anchor="middle">API Gateway</text>
        <text x="310" y="120" fill="#22d3ee" font-size="9" text-anchor="middle">认证 · 鉴权 · 限流</text>
        <text x="310" y="138" fill="#22d3ee" font-size="9" text-anchor="middle">路由 · 审计日志</text>
        <text x="310" y="158" fill="#22d3ee" font-size="9" text-anchor="middle">Schema 校验</text>

        <rect x="220" y="210" width="180" height="100" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
        <text x="310" y="240" fill="white" font-size="13" font-weight="600" text-anchor="middle">MCP Server</text>
        <text x="310" y="260" fill="#34d399" font-size="9" text-anchor="middle">标准化协议</text>
        <text x="310" y="278" fill="#34d399" font-size="9" text-anchor="middle">工具注册 · 权限控制</text>
        <text x="310" y="296" fill="#34d399" font-size="9" text-anchor="middle">隐私保护</text>

        <!-- Data Catalog -->
        <rect x="460" y="70" width="160" height="140" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="2"/>
        <text x="540" y="100" fill="white" font-size="13" font-weight="600" text-anchor="middle">Data Catalog</text>
        <text x="540" y="120" fill="#a78bfa" font-size="9" text-anchor="middle">元数据管理</text>
        <text x="540" y="138" fill="#a78bfa" font-size="9" text-anchor="middle">数据血缘</text>
        <text x="540" y="156" fill="#a78bfa" font-size="9" text-anchor="middle">Schema Registry</text>
        <text x="540" y="174" fill="#a78bfa" font-size="9" text-anchor="middle">数据新鲜度追踪</text>
        <text x="540" y="192" fill="#a78bfa" font-size="9" text-anchor="middle">权限元数据</text>

        <!-- Gateway → MCP, Gateway → Catalog arrows -->
        <line x1="400" y1="130" x2="458" y2="130" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
        <text x="429" y="124" fill="#94a3b8" font-size="7" text-anchor="middle">注册</text>
        <line x1="400" y1="260" x2="458" y2="160" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

        <!-- Arrow from Catalog to Agent Context -->
        <line x1="620" y1="140" x2="700" y2="140" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
        <text x="660" y="134" fill="#94a3b8" font-size="8" text-anchor="middle">查询</text>

        <!-- Agent Context (right side) -->
        <rect x="705" y="70" width="260" height="90" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="835" y="100" fill="white" font-size="13" font-weight="600" text-anchor="middle">Agent Context</text>
        <text x="835" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">统一数据视图 · 可信上下文</text>
        <text x="835" y="138" fill="#94a3b8" font-size="9" text-anchor="middle">结构化 Schema · 实时更新</text>

        <!-- Permission / Audit box -->
        <rect x="705" y="190" width="260" height="80" rx="8" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3"/>
        <text x="835" y="218" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">权限 &amp; 安全边界</text>
        <text x="835" y="238" fill="#94a3b8" font-size="8" text-anchor="middle">RBAC · 数据脱敏 · 操作审计</text>
        <text x="835" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">Read / Analyze / Propose / Execute</text>

        <!-- Legend -->
        <text x="30" y="420" fill="white" font-size="10" font-weight="600">测量指标</text>
        <rect x="30" y="435" width="200" height="16" rx="3" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
        <text x="130" y="447" fill="#94a3b8" font-size="8" text-anchor="middle">数据新鲜度 &lt; 5min · 工具成功率 &gt; 99%</text>
        <rect x="30" y="460" width="200" height="16" rx="3" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1"/>
        <text x="130" y="472" fill="#94a3b8" font-size="8" text-anchor="middle">每次访问：权限校验 + 血缘 + 审计</text>

        <text x="835" y="530" fill="#475569" font-size="9" text-anchor="middle">验收标准：Agent 每次数据访问都有权限校验、数据血缘、审计日志</text>
      </svg>
