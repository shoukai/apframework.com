<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
<style>text { font-family: "JetBrains Mono", "Courier New", monospace; }</style>

        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
          <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/></marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#020617"/>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- Source documents -->
        <text x="30" y="35" fill="#94a3b8" font-size="10" font-weight="600">知识来源</text>
        <rect x="30" y="50" width="140" height="36" rx="5" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="100" y="66" fill="white" font-size="10" font-weight="600" text-anchor="middle">制度文档</text>
        <text x="100" y="80" fill="#94a3b8" font-size="7" text-anchor="middle">政策 · 规章 · 合规</text>

        <rect x="30" y="95" width="140" height="36" rx="5" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="100" y="111" fill="white" font-size="10" font-weight="600" text-anchor="middle">SOP / 流程手册</text>
        <text x="100" y="125" fill="#94a3b8" font-size="7" text-anchor="middle">操作规范</text>

        <rect x="30" y="140" width="140" height="36" rx="5" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="100" y="156" fill="white" font-size="10" font-weight="600" text-anchor="middle">合同模板</text>
        <text x="100" y="170" fill="#94a3b8" font-size="7" text-anchor="middle">条款 · 风险库</text>

        <rect x="30" y="185" width="140" height="36" rx="5" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="100" y="201" fill="white" font-size="10" font-weight="600" text-anchor="middle">FAQ / 术语表</text>
        <text x="100" y="215" fill="#94a3b8" font-size="7" text-anchor="middle">领域知识</text>

        <rect x="30" y="230" width="140" height="36" rx="5" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="100" y="246" fill="white" font-size="10" font-weight="600" text-anchor="middle">案例库 / 公告</text>
        <text x="100" y="260" fill="#94a3b8" font-size="7" text-anchor="middle">经验知识</text>

        <!-- Arrows to parser -->
        <line x1="170" y1="68" x2="215" y2="68" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="170" y1="113" x2="215" y2="113" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="170" y1="158" x2="215" y2="158" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="170" y1="203" x2="215" y2="203" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="170" y1="248" x2="215" y2="248" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Document Parser -->
        <rect x="220" y="55" width="150" height="200" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
        <text x="295" y="85" fill="white" font-size="12" font-weight="600" text-anchor="middle">文档解析</text>
        <text x="295" y="108" fill="#34d399" font-size="8" text-anchor="middle">PDF / Word / Markdown</text>
        <text x="295" y="126" fill="#34d399" font-size="8" text-anchor="middle">表格提取</text>
        <text x="295" y="144" fill="#34d399" font-size="8" text-anchor="middle">嵌套标题识别</text>
        <text x="295" y="162" fill="#34d399" font-size="8" text-anchor="middle">OCR 扫描件</text>
        <text x="295" y="180" fill="#34d399" font-size="8" text-anchor="middle">实体抽取</text>
        <text x="295" y="198" fill="#34d399" font-size="8" text-anchor="middle">关系抽取</text>
        <line x1="220" y1="210" x2="370" y2="210" stroke="#34d399" stroke-width="0.5"/>

        <!-- Chunking -->
        <rect x="400" y="55" width="150" height="90" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
        <text x="475" y="82" fill="white" font-size="12" font-weight="600" text-anchor="middle">Chunking</text>
        <text x="475" y="102" fill="#34d399" font-size="8" text-anchor="middle">按段落 / 语义</text>
        <text x="475" y="120" fill="#34d399" font-size="8" text-anchor="middle">按文档结构</text>
        <text x="475" y="138" fill="#34d399" font-size="8" text-anchor="middle">滑动窗口</text>

        <!-- Split to two paths -->
        <text x="550" y="90" fill="#94a3b8" font-size="7" text-anchor="middle">RAG 路径</text>
        <line x1="550" y1="100" x2="590" y2="100" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- RAG Path: Embedding + Vector DB -->
        <rect x="595" y="55" width="140" height="55" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="665" y="78" fill="white" font-size="11" font-weight="600" text-anchor="middle">Embedding</text>
        <text x="665" y="96" fill="#a78bfa" font-size="8" text-anchor="middle">向量化</text>

        <rect x="595" y="125" width="140" height="55" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="665" y="148" fill="white" font-size="11" font-weight="600" text-anchor="middle">Vector DB</text>
        <text x="665" y="166" fill="#a78bfa" font-size="8" text-anchor="middle">Milvus/Pinecone</text>

        <!-- GraphRAG Path -->
        <text x="550" y="195" fill="#94a3b8" font-size="7" text-anchor="middle">GraphRAG 路径</text>
        <line x1="400" y1="170" x2="403" y2="230" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
        <line x1="403" y1="230" x2="590" y2="230" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

        <rect x="595" y="205" width="140" height="70" rx="6" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="665" y="228" fill="white" font-size="11" font-weight="600" text-anchor="middle">Knowledge Graph</text>
        <text x="665" y="246" fill="#fb923c" font-size="8" text-anchor="middle">实体 + 关系图</text>
        <text x="665" y="262" fill="#fb923c" font-size="8" text-anchor="middle">社区检测 · 分层总结</text>

        <!-- Hybrid Search + Reranker -->
        <line x1="735" y1="82" x2="775" y2="82" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="735" y1="152" x2="775" y2="152" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="735" y1="240" x2="775" y2="240" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

        <!-- BM25 + Hybrid + Reranker -->
        <rect x="780" y="55" width="150" height="90" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="2"/>
        <text x="855" y="82" fill="white" font-size="12" font-weight="600" text-anchor="middle">混合检索</text>
        <text x="855" y="102" fill="#a78bfa" font-size="8" text-anchor="middle">向量 + BM25</text>
        <text x="855" y="120" fill="#a78bfa" font-size="8" text-anchor="middle">Reranker 重排序</text>
        <text x="855" y="138" fill="#a78bfa" font-size="8" text-anchor="middle">权限感知过滤</text>

        <!-- Agent -->
        <line x1="930" y1="100" x2="930" y2="300" stroke="#a78bfa" stroke-width="1.5"/>
        <line x1="780" y1="152" x2="800" y2="300" stroke="#a78bfa" stroke-width="1"/>

        <rect x="780" y="300" width="150" height="80" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="855" y="330" fill="white" font-size="13" font-weight="700" text-anchor="middle">Agent</text>
        <text x="855" y="350" fill="#22d3ee" font-size="9" text-anchor="middle">Context Injection</text>
        <text x="855" y="368" fill="#22d3ee" font-size="9" text-anchor="middle">Citation + Groundedness</text>

        <!-- Knowledge Graph detail -->
        <text x="650" y="400" fill="#94a3b8" font-size="7" text-anchor="middle">典型场景</text>
        <rect x="30" y="415" width="930" height="40" rx="5" fill="rgba(15, 23, 42, 0.3)" stroke="#1e293b" stroke-width="1"/>
        <text x="495" y="432" fill="#94a3b8" font-size="9" text-anchor="middle">合同审查 Agent | 客服知识 Agent | 技术支持 Agent | 投标文档 Agent | 合规问答 Agent</text>
        <text x="495" y="448" fill="#a78bfa" font-size="7" text-anchor="middle">知识层验收：检索命中率 · 引用覆盖率 · 幻觉率 — 可测量、可优化</text>

        <text x="30" y="500" fill="white" font-size="9" font-weight="600">核心判断</text>
        <text x="30" y="520" fill="#94a3b8" font-size="8">• Knowledge Engineering 与 Prompt Engineering 同等重要</text>
        <text x="30" y="538" fill="#94a3b8" font-size="8">• RAG：参数化记忆 + 非参数化记忆 (Lewis et al., NeurIPS 2020)</text>
      </svg>