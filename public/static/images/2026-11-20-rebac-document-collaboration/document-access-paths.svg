<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="title desc">
  <title id="title">项目路线图的三条访问路径</title>
  <desc id="desc">林岚通过本组织管理员角色取得管理及案例规定的读取权限；小陈经研发组和文件夹继承读取；小周通过文档直接分享读取。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#718ba5"/></marker><marker id="derived" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9c8a5c"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#26364a}.title{font-size:21px;font-weight:700}.label{font-size:13px;font-weight:600}.small{font-size:11px;fill:#687b90}.node{fill:#fff;stroke:#d8e1eb;stroke-width:1.3}</style></defs>
  <rect width="680" height="360" rx="16" fill="#fff"/><text x="32" y="40" class="title">《项目路线图》：三种授权依据</text><text x="32" y="64" class="small">结果都是可读，但来源不同；管理权限只属于林岚</text>
  <rect x="32" y="92" width="106" height="46" rx="10" class="node"/><text x="85" y="120" text-anchor="middle" class="label">林岚</text>
  <rect x="224" y="92" width="148" height="46" rx="10" fill="#f5f8fb" stroke="#d8e1eb"/><text x="298" y="120" text-anchor="middle" class="label">本组织管理员角色</text>
  <rect x="498" y="92" width="150" height="46" rx="10" fill="#f2f8f3" stroke="#d2e2d5"/><text x="573" y="112" text-anchor="middle" class="label">管理 + 读取</text><text x="573" y="129" text-anchor="middle" class="small">本案例规定</text>
  <path d="M139 115h77M373 115h115" stroke="#718ba5" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="32" y="172" width="106" height="46" rx="10" class="node"/><text x="85" y="200" text-anchor="middle" class="label">小陈</text>
  <rect x="190" y="172" width="118" height="46" rx="10" fill="#f5f8fb" stroke="#d8e1eb"/><text x="249" y="200" text-anchor="middle" class="label">研发组成员</text>
  <rect x="352" y="172" width="120" height="46" rx="10" fill="#f8f7fb" stroke="#ddd9eb"/><text x="412" y="200" text-anchor="middle" class="label">研发资料</text>
  <rect x="518" y="172" width="130" height="46" rx="10" fill="#f5f8fb" stroke="#d8e1eb"/><text x="583" y="200" text-anchor="middle" class="label">项目路线图</text>
  <path d="M139 195h43M309 195h35M473 195h35" stroke="#718ba5" stroke-width="1.8" marker-end="url(#arrow)"/><text x="329" y="163" text-anchor="middle" class="small">组可读 · 文档属于文件夹</text>
  <path d="M85 219v43h498v-44" fill="none" stroke="#9c8a5c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#derived)"/><rect x="225" y="245" width="218" height="31" rx="8" fill="#fbfaf6" stroke="#e8e2d2"/><text x="334" y="265" text-anchor="middle" class="small">显式继承规则 ⇒ 读取</text>
  <rect x="32" y="300" width="106" height="40" rx="10" class="node"/><text x="85" y="325" text-anchor="middle" class="label">小周</text>
  <rect x="224" y="300" width="232" height="40" rx="10" fill="#fafbfd" stroke="#d8e1eb"/><text x="340" y="325" text-anchor="middle" class="label">路线图的直接分享</text>
  <rect x="498" y="300" width="150" height="40" rx="10" fill="#f2f8f3" stroke="#d2e2d5"/><text x="573" y="325" text-anchor="middle" class="label">读取</text>
  <path d="M139 320h77M457 320h31" stroke="#718ba5" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
