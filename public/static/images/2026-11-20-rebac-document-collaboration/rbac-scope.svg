<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc">
  <title id="title">RBAC：角色分配与组织范围</title>
  <desc id="desc">林岚在甲组织被分配管理员角色，因此可以管理甲组织文档；该角色不自动授权乙组织文档。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6483a5"/></marker>
    <style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#26364a}.label{font-size:15px;font-weight:600}.small{font-size:13px;fill:#63758a}.title{font-size:21px;font-weight:700}.card{fill:#fff;stroke:#d8e1eb;stroke-width:1.5}</style>
  </defs>
  <rect width="680" height="340" rx="16" fill="#fff"/>
  <text x="32" y="40" class="title">RBAC：权限经由角色分配</text>
  <text x="32" y="64" class="small">角色说明职责，分配范围说明该职责作用于哪里</text>
  <rect x="32" y="106" width="142" height="76" rx="12" class="card"/>
  <circle cx="65" cy="137" r="15" fill="#e8f1fb"/><circle cx="65" cy="132" r="5" fill="#6483a5"/><path d="M55 148c2-8 18-8 20 0" fill="none" stroke="#6483a5" stroke-width="2"/>
  <text x="91" y="139" class="label">林岚</text><text x="91" y="160" class="small">用户</text>
  <rect x="268" y="106" width="166" height="76" rx="12" fill="#f4f8fc" stroke="#c9d8e8" stroke-width="1.5"/>
  <rect x="285" y="125" width="28" height="28" rx="7" fill="#e1ebf5"/><path d="M292 133h14M292 139h14M292 145h9" stroke="#587998" stroke-width="1.7"/>
  <text x="322" y="139" class="label">管理员</text><text x="322" y="160" class="small">甲组织角色</text>
  <path d="M176 144H258" fill="none" stroke="#6483a5" stroke-width="2" marker-end="url(#arrow)"/><text x="217" y="132" text-anchor="middle" class="small">分配</text>
  <rect x="508" y="106" width="140" height="76" rx="12" fill="#f4faf6" stroke="#cfdfd4" stroke-width="1.5"/>
  <path d="M526 132l10-7 10 7v18h-20zM531 150v-10h10v10" fill="none" stroke="#5f8b6f" stroke-width="1.7"/>
  <text x="555" y="139" class="label">甲组织文档</text><text x="555" y="160" class="small">管理权限</text>
  <path d="M436 144H498" fill="none" stroke="#6483a5" stroke-width="2" marker-end="url(#arrow)"/><text x="467" y="132" text-anchor="middle" class="small">可管理</text>
  <rect x="32" y="220" width="616" height="78" rx="12" fill="#fafbfd" stroke="#e1e7ee"/>
  <text x="52" y="249" class="label">范围边界</text><text x="52" y="275" class="small">林岚的角色分配属于甲组织；乙组织文档不会因这个角色自动获得授权。</text>
  <text x="32" y="325" class="small">示意：组织范围是本文案例中的分配设计，不代表所有 RBAC 系统的数据结构相同。</text>
</svg>
