<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">治理闭环：模型变更、回归与漂移反馈</title><desc id="desc">能力问题和消费方契约驱动模型审查，执行数据迁移、SHACL、查询和契约回归后发布，再观察漂移并反馈到能力问题。兼容性依赖回归证据，不由版本标签保证。</desc>
