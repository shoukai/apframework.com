<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">企业 AI 的本体工程：从领域问题到可治理的知识</title>
<desc id="desc">以能力问题为起点，区分本体与知识图谱，展示 OWL/RDFS、SKOS、SHACL、LinkML 的职责，以及 TBox、ABox、源数据三层架构、复用和版本治理原则。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637d84"/></marker>
  <style>
    text{font-family:"PingFang SC","Heiti SC","Microsoft YaHei",sans-serif;fill:#263b43}
    .title{font-size:31px;font-weight:700}.sub{font-size:17px;fill:#52666d}
    .section{font-size:20px;font-weight:700}.head{font-size:19px;font-weight:700}
    .body{font-size:16px}.small{font-size:14px;fill:#52666d}.tag{font-size:14px;font-weight:600}
  </style>
</defs>
<rect width="1600" height="1120" fill="#f7faf9"/>
<rect x="28" y="24" width="1544" height="78" rx="10" fill="#eaf1f7" stroke="#c5d6df"/>
<text class="title" x="58" y="62">企业 AI 的本体工程</text>
<text class="sub" x="58" y="86">让领域概念、事实与约束成为可复用的推理上下文</text>
<rect x="1262" y="45" width="278" height="34" rx="17" fill="#fff" stroke="#c5d6df"/>
<text class="tag" x="1401" y="67" text-anchor="middle" fill="#42677a">问题定义 → 建模 → 接入 → 治理</text>

<text class="section" x="42" y="145">01　先把“概念”与“事实”分开</text>
<rect x="42" y="164" width="736" height="128" rx="8" fill="#edf1fb" stroke="#a7b7dd"/>
<text class="head" x="68" y="197" fill="#425f9b">本体 · TBox</text>
<text class="body" x="68" y="229">定义领域有哪些类、属性、关系与公理</text>
<text class="body" x="68" y="257">例：Book 有作者；Holding 是某一本实体馆藏</text>
<text class="small" x="68" y="279">回答：领域概念如何组织、关系意味着什么？</text>
<rect x="822" y="164" width="736" height="128" rx="8" fill="#eaf6f3" stroke="#93c8ba"/>
<text class="head" x="848" y="197" fill="#247565">知识图谱 · ABox</text>
<text class="body" x="848" y="229">记录具体实体及其关系、事实与来源</text>
<text class="body" x="848" y="257">例：馆藏册 H-204 是《球状闪电》的一个副本</text>
<text class="small" x="848" y="279">回答：有哪些对象？已知哪些事实？</text>
<path d="M778 228H822" stroke="#637d84" stroke-width="2" marker-end="url(#arrow)"/>
<text class="small" x="800" y="216" text-anchor="middle">约束</text>

<rect x="42" y="308" width="1516" height="58" rx="8" fill="#eaf6f3" stroke="#b7d8ce"/>
<text class="head" x="64" y="334" fill="#247565">从能力问题开始</text>
<text class="body" x="270" y="334">“哪家分馆有可借的副本？”“张三当前借着哪些书？”</text>
<text class="small" x="64" y="355">问题决定需要哪些概念、关系和数据；查询结果再检验模型是否足以回答。</text>

<text class="section" x="42" y="405">02　标准与工具各司其职，不是固定流水线</text>
<rect x="42" y="424" width="366" height="142" rx="8" fill="#edf1fb" stroke="#a7b7dd"/>
<text class="head" x="62" y="457" fill="#425f9b">OWL / RDFS</text><text class="body" x="62" y="488">类、属性、层级与逻辑语义</text><text class="body" x="62" y="515">可在既定语义下推导类型</text><text class="small" x="62" y="544">开放世界：未记录不等于为假</text>
<rect x="426" y="424" width="366" height="142" rx="8" fill="#eaf6f3" stroke="#93c8ba"/>
<text class="head" x="446" y="457" fill="#247565">SKOS</text><text class="body" x="446" y="488">受控词汇、标签与概念映射</text><text class="body" x="446" y="515">如 preferred / alternate label</text><text class="small" x="446" y="544">broader / narrower 不等同于子类</text>
<rect x="810" y="424" width="366" height="142" rx="8" fill="#fff5df" stroke="#e2c27c"/>
<text class="head" x="830" y="457" fill="#8a651d">SHACL</text><text class="body" x="830" y="488">按形状约束检查数据图</text><text class="body" x="830" y="515">数量、关系、值域等并生成报告</text><text class="small" x="830" y="544">符合形状不证明事实真实</text>
<rect x="1194" y="424" width="364" height="142" rx="8" fill="#edf5f8" stroke="#9bbdcb"/>
<text class="head" x="1214" y="457" fill="#3d6d82">LinkML · 可选</text><text class="body" x="1214" y="488">schema-first 建模与工具生态</text><text class="body" x="1214" y="515">可生成多种目标格式或校验产物</text><text class="small" x="1214" y="544">按团队互操作与维护需求选用</text>

<text class="section" x="42" y="610">03　三层工程视图：定义、实例、来源数据</text>
<rect x="42" y="630" width="1516" height="76" rx="8" fill="#edf1fb" stroke="#a7b7dd"/>
<rect x="42" y="630" width="220" height="76" rx="8" fill="#5e73b8"/>
<text x="64" y="663" font-size="19" font-weight="700" fill="#fff" style="fill:#fff">TBox · 领域模型</text><text x="64" y="687" font-size="14" fill="#fff" style="fill:#fff">类 / 关系 / 约束语义</text>
<text class="body" x="290" y="662">相对稳定，定义概念和关系；需要治理评审与兼容性判断。</text><text class="small" x="290" y="688">变化可能影响映射、数据校验、查询与下游应用。</text>
<rect x="42" y="716" width="1516" height="76" rx="8" fill="#eaf6f3" stroke="#93c8ba"/>
<rect x="42" y="716" width="220" height="76" rx="8" fill="#278675"/>
<text x="64" y="749" font-size="19" font-weight="700" fill="#fff" style="fill:#fff">ABox · 领域事实</text><text x="64" y="773" font-size="14" fill="#fff" style="fill:#fff">实体 / 关系 / 属性值</text>
<text class="body" x="290" y="748">实例化本体中的概念；批量导入、更新和实体消歧时执行校验。</text><text class="small" x="290" y="774">存储可用 RDF 三元组库或其他图/数据系统，取决于需求。</text>
<rect x="42" y="802" width="1516" height="76" rx="8" fill="#f0f4f5" stroke="#c4d1d5"/>
<rect x="42" y="802" width="220" height="76" rx="8" fill="#607780"/>
<text x="64" y="835" font-size="19" font-weight="700" fill="#fff" style="fill:#fff">源数据 · 接入层</text><text x="64" y="859" font-size="14" fill="#fff" style="fill:#fff">文档 / 数据库 / API</text>
<text class="body" x="290" y="834">抽取与映射 → 实体消歧与归并 → SHACL 等校验 → 写入知识图谱</text><text class="small" x="290" y="860">保留来源与溯源信息；真实系统可按部署边界合并或拆分。</text>

<text class="section" x="42" y="922">04　落地时：优先复用，保持模型可治理</text>
<rect x="42" y="942" width="480" height="82" rx="8" fill="#fff5df" stroke="#e2c27c"/>
<text class="head" x="62" y="972" fill="#8a651d">先看领域现成词汇</text><text class="small" x="62" y="999">FIBO（金融）· SNOMED CT（临床）· Schema.org（通用）</text>
<rect x="540" y="942" width="480" height="82" rx="8" fill="#eaf6f3" stroke="#93c8ba"/>
<text class="head" x="560" y="972" fill="#247565">用能力问题收敛范围</text><text class="small" x="560" y="999">先定义要回答的问题，再逐步补概念与关系</text>
<rect x="1038" y="942" width="520" height="82" rx="8" fill="#edf5f8" stroke="#9bbdcb"/>
<text class="head" x="1058" y="972" fill="#3d6d82">变更要可追踪、可验证</text><text class="small" x="1058" y="999">记录版本与迁移影响；用测试确认旧查询和数据仍成立</text>
<text class="small" x="42" y="1066">本体为检索、抽取与推理提供领域结构；模型输出仍需数据校验、来源追踪与业务授权。</text>
<text class="small" x="1558" y="1094" text-anchor="end">企业 AI · 本体工程</text>
</svg>