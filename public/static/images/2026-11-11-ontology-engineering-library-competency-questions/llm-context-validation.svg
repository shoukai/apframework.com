<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">LLM 上下文与抽取校验分工</title><desc id="desc">回答时分别提供模型定义和有来源时点的事实，由 LLM 组织答案；抽取时 LLM 只提出候选，程序对齐身份并以 SHACL 校验；业务服务独立负责动作授权和并发检查。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56798b"/></marker></defs><rect width="1200" height="410" rx="12" fill="#f7faf9" stroke="#d9e5e1"/>
<g font-family="PingFang SC, Heiti SC, Microsoft YaHei, sans-serif" fill="#263b43"><text x="36" y="48" font-size="22" font-weight="600">同一模型，两条用途不同的路径</text>
<text x="36" y="102" font-size="22" font-weight="600" fill="#247565">回答：定义与事实分别供给</text>
<g stroke="#93c8ba" fill="#eaf6f3"><rect x="36" y="126" width="280" height="92" rx="8"/><rect x="36" y="242" width="280" height="92" rx="8"/></g><text x="56" y="164" font-size="22" font-weight="600">定义上下文</text><text x="56" y="199" font-size="22">Holding 含义 + 模型版本</text><text x="56" y="280" font-size="22" font-weight="600">事实上下文</text><text x="56" y="315" font-size="22">状态 + 来源时点</text>
<path d="M316 172 H390 V218 H440 M316 288 H390 V242 H440" fill="none" stroke="#56798b" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="170" width="270" height="120" rx="8" fill="#edf1fb" stroke="#a7b7dd"/><text x="460" y="216" font-size="22" font-weight="600" fill="#425f9b">LLM 组织回答</text><text x="460" y="254" font-size="22">解释定义，复述事实</text><text x="745" y="205" font-size="22">定义不能证明“现在可借”</text><text x="745" y="245" font-size="22">答案注明查询范围与时点</text><text x="745" y="285" font-size="22">提示词不是事实验证器</text>
<path d="M36 350 H1160" stroke="#d9e5e1"/><text x="36" y="385" font-size="22" font-weight="600" fill="#8a651d">抽取：LLM 提候选 / 程序对齐 ID 与 SHACL 校验 / 符合后入图；动作授权由业务服务独立负责</text></g></svg>
