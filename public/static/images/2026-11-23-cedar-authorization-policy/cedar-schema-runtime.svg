<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="t d"><title id="t">策略验证与运行时授权分离</title><desc id="d">策略创建阶段使用Schema做静态验证；运行时由应用提供PARC、entities、policies给authorizer，Schema不是每次请求输入。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71849a"/></marker></defs><rect width="680" height="330" rx="18" fill="#fff"/><text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#253746">两条流程：先验证策略，运行时另做授权</text><rect x="24" y="62" width="632" height="105" rx="14" fill="#fffaf0" stroke="#ead6ab"/><text x="42" y="89" font-family="sans-serif" font-size="16" font-weight="700" fill="#705a2c">策略创建 / 更新时</text><rect x="43" y="105" width="155" height="43" rx="10" fill="#fff" stroke="#c6b37e"/><text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#514526">Schema + policies</text><path d="M201 127H249" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><rect x="256" y="105" width="157" height="43" rx="10" fill="#fff" stroke="#c6b37e"/><text x="334" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#514526">validator</text><path d="M416 127H464" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><rect x="471" y="105" width="157" height="43" rx="10" fill="#fff" stroke="#c6b37e"/><text x="549" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#514526">valid / diagnostics</text><rect x="24" y="188" width="632" height="117" rx="14" fill="#f0f6ff" stroke="#abc5e3"/><text x="42" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#345778">每次运行时授权</text><rect x="43" y="235" width="185" height="47" rx="10" fill="#fff" stroke="#91add0"/><text x="135" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#344d68">应用：PARC + entities</text><path d="M231 258H280" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><rect x="288" y="235" width="157" height="47" rx="10" fill="#fff" stroke="#91add0"/><text x="366" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#344d68">authorizer + policies</text><path d="M448 258H492" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><rect x="500" y="235" width="128" height="47" rx="10" fill="#fff" stroke="#91add0"/><text x="564" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#344d68">decision</text><text x="339" y="333" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#657789">Schema不是实体存储，也不是授权API每次调用时的强制输入</text></svg>
