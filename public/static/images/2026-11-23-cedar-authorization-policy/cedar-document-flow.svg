<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="t d"><title id="t">项目路线图一次授权与读取链路</title><desc id="d">应用收集关系事实与可信context、组织PARC，Cedar分别评估permit和forbid，返回decision与diagnostics，应用只在Allow后读取文档。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71849a"/></marker></defs><rect width="680" height="350" rx="18" fill="#fff"/><text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#253746">《项目路线图》：关系事实、上下文与策略共同决定读取</text><rect x="25" y="68" width="190" height="105" rx="12" fill="#eef5ff" stroke="#9ebcde"/><text x="120" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#345778">应用组织输入</text><text x="120" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#43586e">小陈 → engineering组</text><text x="120" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#43586e">文档 → engineering-docs</text><rect x="25" y="191" width="190" height="91" rx="12" fill="#f4f1fa" stroke="#bdacd4"/><text x="120" y="219" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#554675">可信请求context</text><text x="120" y="247" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#625678">MFA · 来源IP · 服务端时间</text><rect x="260" y="107" width="190" height="143" rx="14" fill="#f6f8f4" stroke="#adc0a8"/><text x="355" y="137" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#3e5a3c">Cedar authorizer</text><rect x="281" y="151" width="148" height="34" rx="8" fill="#eaf5ee" stroke="#a8cbb4"/><text x="355" y="174" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#356044">permit：关系 / 分享</text><rect x="281" y="196" width="148" height="34" rx="8" fill="#fff0ef" stroke="#e3b9b6"/><text x="355" y="219" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#824944">forbid：MFA / 网段</text><path d="M217 132H256" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><path d="M217 230H239Q250 230 260 215" fill="none" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><rect x="494" y="82" width="158" height="58" rx="11" fill="#eaf6ef" stroke="#83b49a"/><text x="573" y="107" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#285c40">decision +</text><text x="573" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#285c40">diagnostics</text><path d="M452 142H489" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><rect x="494" y="165" width="158" height="90" rx="11" fill="#f7f7f7" stroke="#cbd2d8"/><text x="573" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#43515e">应用执行</text><text x="573" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52616e">Allow → 返回文档</text><text x="573" y="245" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52616e">Deny → 不返回文档</text><path d="M573 143V161" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><text x="340" y="316" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#657789">输入事实由应用提供；策略求值与资源访问执行是两个步骤。</text></svg>
