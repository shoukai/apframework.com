<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d"><title id="t">Cedar授权请求输入与输出</title><desc id="d">应用收集PARC和entities，连同policies提交给authorizer，返回decision与diagnostics。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71849a"/></marker></defs><rect width="680" height="300" rx="18" fill="#fff"/><text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#253746">一次授权调用需要哪些输入？</text><rect x="24" y="75" width="216" height="174" rx="13" fill="#edf5ff" stroke="#8db5e4" stroke-width="1.5"/><text x="42" y="105" font-family="sans-serif" font-size="16" font-weight="700" fill="#24476c">应用收集</text><text x="42" y="136" font-family="sans-serif" font-size="16" fill="#253746">P 主体　A 操作</text><text x="42" y="162" font-family="sans-serif" font-size="16" fill="#253746">R 资源　C 上下文</text><text x="42" y="195" font-family="sans-serif" font-size="15" fill="#52677d">PARC + entities</text><text x="42" y="223" font-family="sans-serif" font-size="15" fill="#52677d">上下文来自可信服务端</text><rect x="281" y="102" width="166" height="112" rx="14" fill="#f1f7f2" stroke="#91b99b" stroke-width="1.5"/><text x="364" y="139" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#315e3d">Cedar authorizer</text><text x="364" y="171" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#435b49">policies + entities</text><rect x="299" y="43" width="130" height="38" rx="10" fill="#fff7e9" stroke="#dfbd7f"/><text x="364" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#745925">适用策略</text><path d="M364 82V99" fill="none" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><path d="M242 157H277" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#a)"/><rect x="490" y="94" width="165" height="54" rx="12" fill="#eaf6ef" stroke="#83b49a"/><text x="572" y="127" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#285c40">decision</text><rect x="490" y="165" width="165" height="54" rx="12" fill="#f4f1fa" stroke="#b6a4d3"/><text x="572" y="198" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#554675">diagnostics</text><path d="M449 141H486" fill="none" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><path d="M449 178H486" fill="none" stroke="#71849a" stroke-width="1.8" marker-end="url(#a)"/><text x="572" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52677d">Allow / Deny + 错误信息</text><text x="28" y="281" font-family="sans-serif" font-size="15" fill="#68798a">应用负责准备数据，并在收到结果后决定是否执行操作。</text></svg>
