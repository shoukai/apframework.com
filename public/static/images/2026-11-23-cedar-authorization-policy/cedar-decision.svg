<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="t d"><title id="t">Cedar策略结果合成矩阵</title><desc id="d">forbid true优先；无forbid且至少一个permit true才允许；无permit默认拒绝；单策略error会被跳过并留在diagnostics。</desc><rect width="680" height="330" rx="18" fill="#fff"/><text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#253746">先看 forbid，再看 permit；error按单条策略处理</text><rect x="28" y="58" width="624" height="38" rx="8" fill="#edf2f7"/><text x="43" y="83" font-family="sans-serif" font-size="15" font-weight="700" fill="#42556a">本次求值结果</text><text x="344" y="83" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#42556a">合并条件</text><text x="594" y="83" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#42556a">最终决策</text><rect x="28" y="103" width="624" height="44" rx="8" fill="#fff0ef" stroke="#edc5c2"/><text x="43" y="131" font-family="sans-serif" font-size="15" fill="#673b38">至少一个 forbid = true</text><text x="344" y="131" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#673b38">permit可真可假</text><text x="594" y="131" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#a23e37">Deny（覆盖）</text><rect x="28" y="153" width="624" height="44" rx="8" fill="#edf7f0" stroke="#bfddc7"/><text x="43" y="181" font-family="sans-serif" font-size="15" fill="#345c40">没有 forbid = true</text><text x="344" y="181" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#345c40">至少一个 permit = true</text><text x="594" y="181" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#277044">Allow</text><rect x="28" y="203" width="624" height="44" rx="8" fill="#f3f5f7" stroke="#d5dce3"/><text x="43" y="231" font-family="sans-serif" font-size="15" fill="#465461">没有命中 permit</text><text x="344" y="231" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#465461">无显式授权</text><text x="594" y="231" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#546474">Deny（默认）</text><rect x="28" y="253" width="624" height="48" rx="8" fill="#f5f1fb" stroke="#d9c9eb"/><text x="43" y="274" font-family="sans-serif" font-size="15" fill="#594873">某一 policy = error</text><text x="344" y="274" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#594873">跳过该条；其他策略继续</text><text x="594" y="274" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#594873">记录诊断</text><text x="340" y="322" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8b5149">错误 forbid 也会被跳过；若有 permit 命中，仍可能 Allow</text></svg>
