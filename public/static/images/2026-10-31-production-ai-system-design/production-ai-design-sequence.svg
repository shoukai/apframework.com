<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">生产 AI 系统设计的六步流程</title>
  <desc id="desc">六个依次推进的步骤：明确任务与边界；估算流量、并发、Token 和成本；按职责拆分系统；把安全、权限、恢复和人工控制放入流程；分别评估系统健康与答案质量；通过测试、灰度和反馈持续迭代。</desc>
  <rect width="1200" height="1080" fill="#ffffff"/>
  <text x="64" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b">生产 AI 系统设计：从问题定义到持续运行</text>
  <text x="64" y="94" font-family="Arial, sans-serif" font-size="16" fill="#53616d">六个连续的设计检查点；流程可按项目风险和规模裁剪</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="135" width="1000" height="108" rx="5" fill="#e8f3f6" stroke="#3b7685" stroke-width="2"/>
    <circle cx="155" cy="189" r="27" fill="#ffffff" stroke="#3b7685" stroke-width="2"/>
    <text x="155" y="197" text-anchor="middle" font-size="22" font-weight="700" fill="#173d49">1</text>
    <text x="205" y="181" font-size="22" font-weight="700" fill="#173d49">明确任务与边界</text>
    <text x="205" y="212" font-size="16" fill="#273640">要完成什么？哪些动作不能由 AI 独立执行？</text>

    <rect x="100" y="285" width="1000" height="108" rx="5" fill="#f1f4f5" stroke="#617680" stroke-width="2"/>
    <circle cx="155" cy="339" r="27" fill="#ffffff" stroke="#617680" stroke-width="2"/>
    <text x="155" y="347" text-anchor="middle" font-size="22" font-weight="700" fill="#263b44">2</text>
    <text x="205" y="331" font-size="22" font-weight="700" fill="#263b44">估算流量、并发、Token 和成本</text>
    <text x="205" y="362" font-size="16" fill="#273640">区分平均与峰值；估算模型和服务两侧容量</text>

    <rect x="100" y="435" width="1000" height="108" rx="5" fill="#f4efe3" stroke="#9b7b3f" stroke-width="2"/>
    <circle cx="155" cy="489" r="27" fill="#ffffff" stroke="#9b7b3f" stroke-width="2"/>
    <text x="155" y="497" text-anchor="middle" font-size="22" font-weight="700" fill="#554322">3</text>
    <text x="205" y="481" font-size="22" font-weight="700" fill="#554322">按职责拆分系统</text>
    <text x="205" y="512" font-size="16" fill="#3f382b">先定模块职责，再决定部署和技术选型</text>

    <rect x="100" y="585" width="1000" height="108" rx="5" fill="#eaf2e9" stroke="#587a55" stroke-width="2"/>
    <circle cx="155" cy="639" r="27" fill="#ffffff" stroke="#587a55" stroke-width="2"/>
    <text x="155" y="647" text-anchor="middle" font-size="22" font-weight="700" fill="#284528">4</text>
    <text x="205" y="631" font-size="22" font-weight="700" fill="#284528">把控制措施放进流程</text>
    <text x="205" y="662" font-size="16" fill="#273c29">安全 · 权限 · 故障恢复 · 人工审批</text>

    <rect x="100" y="735" width="1000" height="108" rx="5" fill="#f5ece9" stroke="#916858" stroke-width="2"/>
    <circle cx="155" cy="789" r="27" fill="#ffffff" stroke="#916858" stroke-width="2"/>
    <text x="155" y="797" text-anchor="middle" font-size="22" font-weight="700" fill="#54382d">5</text>
    <text x="205" y="781" font-size="22" font-weight="700" fill="#54382d">分别评估系统健康与答案质量</text>
    <text x="205" y="812" font-size="16" fill="#3e302b">服务可用不代表结果正确；质量也不等于低延迟</text>

    <rect x="100" y="885" width="1000" height="108" rx="5" fill="#edf0f2" stroke="#59656d" stroke-width="2"/>
    <circle cx="155" cy="939" r="27" fill="#ffffff" stroke="#59656d" stroke-width="2"/>
    <text x="155" y="947" text-anchor="middle" font-size="22" font-weight="700" fill="#28343b">6</text>
    <text x="205" y="931" font-size="22" font-weight="700" fill="#28343b">通过测试、灰度和反馈持续迭代</text>
    <text x="205" y="962" font-size="16" fill="#273640">验证变更，逐步放量，把线上问题纳入回归</text>

    <g stroke="#53616d" stroke-width="2.5" fill="none">
      <line x1="600" y1="243" x2="600" y2="277"/><path d="M590 269 L600 281 L610 269"/>
      <line x1="600" y1="393" x2="600" y2="427"/><path d="M590 419 L600 431 L610 419"/>
      <line x1="600" y1="543" x2="600" y2="577"/><path d="M590 569 L600 581 L610 569"/>
      <line x1="600" y1="693" x2="600" y2="727"/><path d="M590 719 L600 731 L610 719"/>
      <line x1="600" y1="843" x2="600" y2="877"/><path d="M590 869 L600 881 L610 869"/>
    </g>
  </g>
  <text x="64" y="1038" font-family="Arial, sans-serif" font-size="13" fill="#53616d">经验路径整理自 Piyush Kashyap, “AI System Design: A Practical Guide to Production AI”；非强制瀑布式流程。</text>
</svg>
