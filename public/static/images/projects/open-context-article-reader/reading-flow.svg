    <path d="M1114 524h53" stroke="#d9417b" stroke-width="5" stroke-linecap="round"/>
    <path d="m1150 506 20 18-20 18" fill="none" stroke="#d9417b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1185" y="207" width="561" height="638" rx="22" fill="url(#panel)"/>
    <text x="1231" y="277" fill="#e7edf1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="600">读懂内容，也看清边界</text>
