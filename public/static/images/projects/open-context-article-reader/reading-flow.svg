    <rect x="118" y="207" width="996" height="638" rx="22" fill="#fcfcfb" stroke="#e4e6e8" stroke-width="2"/>
    <rect x="157" y="248" width="186" height="44" rx="22" fill="#fce7f1"/>
    <text x="191" y="278" fill="#ad275d" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600">文章正文</text>
    <text x="160" y="361" fill="#25313d" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="47" font-weight="700">从作者的问题出发</text>
    <rect x="160" y="400" width="646" height="17" rx="8.5" fill="#d5dce1"/>
    <rect x="160" y="441" width="783" height="17" rx="8.5" fill="#e0e5e8"/>
    <rect x="160" y="482" width="719" height="17" rx="8.5" fill="#e0e5e8"/>
    <rect x="147" y="536" width="871" height="107" rx="14" fill="#fdf0f5"/>
