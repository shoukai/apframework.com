    <text x="1310" y="557" fill="#b9c5cf" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22">用正文做法解释要点</text>

    <path d="M1232 600h466" stroke="#44505e" stroke-width="2"/>
    <circle cx="1262" cy="672" r="26" fill="#ad275d"/>
    <text x="1247" y="681" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="700">03</text>
    <text x="1310" y="664" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="650">证据边界</text>
    <text x="1310" y="702" fill="#b9c5cf" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22">原文 · 推断 · 未知</text>
    <rect x="1232" y="760" width="465" height="2" fill="#44505e"/>
    <text x="1232" y="803" fill="#899aa8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" letter-spacing="3">OPEN CONTEXT ARTICLE READER</text>
