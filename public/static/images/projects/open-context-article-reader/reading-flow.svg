<svg xmlns="http://www.w3.org/2000/svg" width="1865" height="960" viewBox="0 0 1865 960" role="img" aria-labelledby="title desc">
  <title id="title">Open Context Article Reader 阅读流程示意</title>
  <desc id="desc">左侧是一篇带有重点标记的文章，右侧依次列出中心意思、关键概念与证据边界。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3f2"/>
      <stop offset="1" stop-color="#e5eaed"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#273341"/>
      <stop offset="1" stop-color="#17212c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#24303b" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1865" height="960" fill="url(#background)"/>
  <circle cx="151" cy="102" r="205" fill="#fce7f1" opacity=".7"/>
  <circle cx="1757" cy="873" r="260" fill="#dce8ec" opacity=".8"/>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="1737" height="844" rx="32" fill="#fff"/>
    <path d="M96 58h1673a32 32 0 0 1 32 32v66H64V90a32 32 0 0 1 32-32Z" fill="#f9fafb"/>
    <path d="M64 156h1737" stroke="#e6e9ed" stroke-width="2"/>
