<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Tool Gateway Architecture</title>
  <desc id="desc">A tool call flows from LLM Agent through Tool Gateway, Schema Validation, Policy Engine, HITL approval if needed, Tool Executor, Audit Trace, and real resources.</desc>

  <style>
    text {
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    .label {
      fill: #e2e8f0;
      font-size: 15px;
      font-weight: 700;
    }
    .sub {
      fill: #94a3b8;
      font-size: 10px;
      font-weight: 500;
    }
    .tiny {
      fill: #94a3b8;
      font-size: 9px;
      font-weight: 500;
    }
    .section {
      fill: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
    }
  </style>

  <defs>
    <marker id="arrow-cyan" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-slate" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#34d399" />
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#fb923c" />
    </marker>
    <marker id="arrow-rose" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-violet" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#a78bfa" />
    </marker>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.55" />
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="#020617" />
  <rect width="1200" height="760" fill="url(#grid)" opacity="0.65" />
  <rect x="32" y="32" width="1136" height="696" rx="18" fill="#0f172a" opacity="0.42" stroke="#1e293b" stroke-width="1" />

  <!-- Header -->
  <text x="60" y="72" fill="#e2e8f0" font-size="22" font-weight="800">Tool Gateway Architecture</text>
  <text x="60" y="96" fill="#94a3b8" font-size="12" font-weight="500">Every tool call becomes a runtime authorization request before real execution.</text>

  <!-- Main lanes -->
  <rect x="52" y="124" width="218" height="430" rx="14" fill="#082f49" opacity="0.35" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="7 5" />
  <text x="72" y="150" class="section" fill="#22d3ee">MODEL INTENT</text>

  <rect x="300" y="124" width="430" height="430" rx="14" fill="#111827" opacity="0.7" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="8 5" />
  <text x="322" y="150" fill="#fb7185" font-size="12" font-weight="800">TOOL GATEWAY · SECURITY BOUNDARY</text>

  <rect x="760" y="124" width="388" height="430" rx="14" fill="#052e1f" opacity="0.28" stroke="#34d399" stroke-width="1.2" stroke-dasharray="7 5" />
  <text x="782" y="150" fill="#34d399" font-size="12" font-weight="800">CONTROLLED EXECUTION</text>

  <!-- LLM Agent -->
  <rect x="78" y="196" width="166" height="88" rx="12" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#soft-shadow)" />
  <text x="161" y="229" class="label" text-anchor="middle">LLM / Agent</text>
  <text x="161" y="250" class="sub" text-anchor="middle">generates tool call</text>
  <text x="161" y="266" fill="#67e8f9" font-size="9" text-anchor="middle">name + args + call_id</text>

  <rect x="78" y="376" width="166" height="88" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.6" />
  <text x="161" y="409" class="label" text-anchor="middle">Tool Result</text>
  <text x="161" y="430" class="sub" text-anchor="middle">answer or plan again</text>
  <text x="161" y="446" fill="#67e8f9" font-size="9" text-anchor="middle">output returns to model</text>

  <!-- Gateway core -->
  <rect x="342" y="184" width="226" height="64" rx="12" fill="#7f1d1d" opacity="0.56" stroke="#fb7185" stroke-width="2" filter="url(#soft-shadow)" />
  <text x="455" y="210" class="label" text-anchor="middle">Gateway Entry</text>
  <text x="455" y="232" class="sub" text-anchor="middle">single unbypassable path</text>

  <rect x="342" y="282" width="226" height="64" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
  <text x="455" y="308" class="label" text-anchor="middle">Schema Validation</text>
  <text x="455" y="330" class="sub" text-anchor="middle">shape, required fields, types</text>

  <rect x="342" y="380" width="226" height="86" rx="12" fill="#064e3b" opacity="0.72" stroke="#34d399" stroke-width="2" filter="url(#soft-shadow)" />
  <text x="455" y="409" class="label" text-anchor="middle">Policy Engine</text>
  <text x="455" y="431" class="sub" text-anchor="middle">user + agent + action</text>
  <text x="455" y="448" class="sub" text-anchor="middle">tool + resource + context</text>

  <!-- Registry -->
  <rect x="586" y="184" width="118" height="162" rx="12" fill="#2e1065" opacity="0.68" stroke="#a78bfa" stroke-width="1.8" />
  <text x="645" y="211" class="label" text-anchor="middle">Registry</text>
  <text x="645" y="235" class="tiny" text-anchor="middle">tool metadata</text>
  <text x="645" y="253" class="tiny" text-anchor="middle">JSON Schema</text>
  <text x="645" y="271" class="tiny" text-anchor="middle">RBAC</text>
  <text x="645" y="289" class="tiny" text-anchor="middle">risk level</text>
  <text x="645" y="319" fill="#c4b5fd" font-size="9" text-anchor="middle">design-time</text>

  <!-- Decision branches -->
  <rect x="786" y="184" width="160" height="64" rx="12" fill="#064e3b" opacity="0.72" stroke="#34d399" stroke-width="2" />
  <text x="866" y="211" class="label" text-anchor="middle">ALLOW</text>
  <text x="866" y="233" class="sub" text-anchor="middle">run now</text>

  <rect x="786" y="297" width="160" height="64" rx="12" fill="#7c2d12" opacity="0.58" stroke="#fb923c" stroke-width="2" />
  <text x="866" y="324" class="label" text-anchor="middle">APPROVAL</text>
  <text x="866" y="346" class="sub" text-anchor="middle">pause for HITL</text>

  <rect x="786" y="410" width="160" height="64" rx="12" fill="#881337" opacity="0.58" stroke="#fb7185" stroke-width="2" />
  <text x="866" y="437" class="label" text-anchor="middle">DENY</text>
  <text x="866" y="459" class="sub" text-anchor="middle">return reason</text>

  <rect x="986" y="282" width="132" height="94" rx="12" fill="#7c2d12" opacity="0.38" stroke="#fb923c" stroke-width="1.8" />
  <text x="1052" y="311" class="label" text-anchor="middle">HITL</text>
  <text x="1052" y="333" class="sub" text-anchor="middle">human approval</text>
  <text x="1052" y="351" fill="#fed7aa" font-size="9" text-anchor="middle">deterministic rule</text>

  <rect x="986" y="412" width="132" height="64" rx="12" fill="#064e3b" opacity="0.72" stroke="#34d399" stroke-width="2" />
  <text x="1052" y="439" class="label" text-anchor="middle">Executor</text>
  <text x="1052" y="461" class="sub" text-anchor="middle">real code runs</text>

  <!-- Resources -->
  <rect x="768" y="588" width="374" height="92" rx="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <text x="955" y="619" class="label" text-anchor="middle">Real Resources</text>
  <text x="955" y="642" class="sub" text-anchor="middle">Database · API · File System · Email · Shell · MCP Server</text>
  <text x="955" y="662" fill="#cbd5e1" font-size="10" text-anchor="middle">side effects happen here, never inside the model</text>

  <!-- Audit -->
  <rect x="78" y="588" width="620" height="92" rx="14" fill="#2e1065" opacity="0.36" stroke="#a78bfa" stroke-width="1.7" />
  <text x="388" y="619" class="label" text-anchor="middle">Audit Trace</text>
  <text x="388" y="642" class="sub" text-anchor="middle">userId · agentId · sessionId · toolId · resource · args hash · decision · result</text>
  <text x="388" y="662" fill="#c4b5fd" font-size="10" text-anchor="middle">write evidence while the call is being decided and executed</text>

  <!-- Flow arrows -->
  <line x1="244" y1="240" x2="336" y2="216" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-cyan)" />
  <text x="292" y="214" fill="#67e8f9" font-size="10" text-anchor="middle">tool_call</text>

  <line x1="455" y1="248" x2="455" y2="276" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)" />
  <line x1="455" y1="346" x2="455" y2="374" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)" />

  <path d="M 586 266 C 560 286, 548 330, 566 390" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-violet)" />
  <text x="596" y="371" fill="#c4b5fd" font-size="9">metadata</text>

  <path d="M 568 410 C 642 372, 698 235, 780 216" fill="none" stroke="#34d399" stroke-width="2.1" marker-end="url(#arrow-green)" />
  <text x="678" y="294" fill="#34d399" font-size="10">allow</text>

  <path d="M 568 423 C 644 423, 703 329, 780 329" fill="none" stroke="#fb923c" stroke-width="2.1" marker-end="url(#arrow-orange)" />
  <text x="679" y="399" fill="#fb923c" font-size="10">approval</text>

  <path d="M 568 438 C 645 486, 704 442, 780 442" fill="none" stroke="#fb7185" stroke-width="2.1" marker-end="url(#arrow-rose)" />
  <text x="682" y="469" fill="#fb7185" font-size="10">deny</text>

  <line x1="946" y1="216" x2="980" y2="444" stroke="#34d399" stroke-width="2.1" marker-end="url(#arrow-green)" />
  <line x1="946" y1="329" x2="980" y2="329" stroke="#fb923c" stroke-width="2.1" marker-end="url(#arrow-orange)" />
  <line x1="1052" y1="376" x2="1052" y2="406" stroke="#34d399" stroke-width="2.1" marker-end="url(#arrow-green)" />
  <text x="1066" y="396" fill="#34d399" font-size="9">approved</text>

  <path d="M 866 474 C 866 528, 640 542, 276 542 C 252 542, 244 500, 244 448" fill="none" stroke="#fb7185" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow-rose)" />

  <line x1="1052" y1="476" x2="1052" y2="582" stroke="#34d399" stroke-width="2.1" marker-end="url(#arrow-green)" />
  <path d="M 986 444 C 932 506, 880 520, 804 520 L 286 520 C 258 520, 244 484, 244 448" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-cyan)" />

  <!-- Audit taps -->
  <path d="M 455 466 C 455 520, 388 534, 388 582" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-violet)" />
  <path d="M 1052 476 C 968 542, 636 534, 636 582" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-violet)" />

  <!-- Footer statement -->
  <rect x="300" y="708" width="600" height="34" rx="17" fill="#020617" stroke="#334155" stroke-width="1" />
  <text x="600" y="730" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Security boundary lives on the tool execution path, not in the prompt.</text>
</svg>
