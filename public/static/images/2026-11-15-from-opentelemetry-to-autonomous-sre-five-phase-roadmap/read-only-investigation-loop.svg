<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">只读 AI 调查与可复核报告</title><desc id="desc">编排器限定查询范围，只读工具返回证据，模型列出假设与替代解释。必要时按缺口继续查询；工程师复核与验证，无写入生产操作入口。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#697d8b"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<g font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#283e4c">
<text x="28" y="32" font-size="16" font-weight="600">先把调查做成可复核的只读循环</text>
<rect x="28" y="65" width="190" height="87" rx="7" fill="#edf5fa" stroke="#bfd4e1"/><text x="123" y="92" text-anchor="middle" font-weight="600">调查编排器</text><text x="123" y="115" text-anchor="middle">事故 / 服务 / 时间窗</text><text x="123" y="137" text-anchor="middle" fill="#536c7a">限定权限与查询范围</text>
<path d="M218 108H262" fill="none" stroke="#697d8b" marker-end="url(#arrow)"/>
<rect x="264" y="65" width="190" height="87" rx="7" fill="#eff7f3" stroke="#b6d3c5"/><text x="359" y="92" text-anchor="middle" font-weight="600">只读诊断工具</text><text x="359" y="115" text-anchor="middle">trace / 指标 / 日志</text><text x="359" y="137" text-anchor="middle" fill="#536c7a">依赖与变更记录</text>
<path d="M454 108H498" fill="none" stroke="#697d8b" marker-end="url(#arrow)"/>
<rect x="500" y="65" width="190" height="87" rx="7" fill="#fff6e8" stroke="#dfc99f"/><text x="595" y="92" text-anchor="middle" font-weight="600">LLM 解释证据</text><text x="595" y="115" text-anchor="middle">归纳 / 假设 / 信息缺口</text><text x="595" y="137" text-anchor="middle" fill="#536c7a">不将相关性当作根因</text>
<path d="M690 108H734" fill="none" stroke="#697d8b" marker-end="url(#arrow)"/>
<rect x="736" y="65" width="196" height="87" rx="7" fill="#edf5fa" stroke="#bfd4e1"/><text x="834" y="92" text-anchor="middle" font-weight="600">工程师复核</text><text x="834" y="115" text-anchor="middle">回到原记录检查结论</text><text x="834" y="137" text-anchor="middle" fill="#536c7a">决定下一步验证</text>
<path d="M595 152V185H123V154" fill="none" stroke="#697d8b" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="359" y="207" text-anchor="middle" fill="#536c7a">需要补证时：针对缺口再查询，检查调查轨迹，避免无效循环。</text>
<rect x="28" y="230" width="904" height="100" rx="8" fill="#ffffff" stroke="#bfd4e1"/><text x="48" y="255" font-weight="600">报告保留四类内容，并明确尚缺的信息</text>
<text x="48" y="286">主要假设</text><text x="48" y="310" fill="#536c7a">当前最可能的解释</text>
<text x="274" y="286">支持证据</text><text x="274" y="310" fill="#536c7a">可访问的 trace / 记录</text>
<text x="500" y="286">替代解释</text><text x="500" y="310" fill="#536c7a">其他可能原因与缺口</text>
<text x="726" y="286">下一步验证</text><text x="726" y="310" fill="#536c7a">比较变更前后的行为</text>
<text x="28" y="363">权限边界：查询 API 按实际能力审查；此阶段没有重启服务、修改配置等写入入口。</text>
<text x="28" y="386" fill="#536c7a">报告可复核、假设经验证，才有依据评估调查是否有效。</text>
</g></svg>
