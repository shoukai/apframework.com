# Include at server scope in the HTTPS apframework.com vhost serving out/.
error_page 404 /404.html;

location = /404.html {
    internal;
}

# These are the malformed URLs observed in the analytics reports. Match the
# original encoded path so the misdecoded characters stay out of this file.
if ($request_uri ~* "^/tags/%C3%A6%C2%A8%C2%A1%C3%A5%C2%9E%C2%8B%C3%A9%C2%AA%C2%8C%C3%A8%C2%AF%C2%81/?(?:[?]|$)") {
    return 301 https://apframework.com/tags/%E6%A8%A1%E5%9E%8B%E9%AA%8C%E8%AF%81$is_args$args;
}
if ($request_uri ~* "^/tags/%C3%A4%C2%B8%C2%9A%C3%A5%C2%8A%C2%A1%C3%A5%C2%88%C2%86%C3%A7%C2%B1%C2%BB/?(?:[?]|$)") {
    return 301 https://apframework.com/tags/%E4%B8%9A%E5%8A%A1%E5%88%86%E7%B1%BB$is_args$args;
}
if ($request_uri ~* "^/tags/%C3%A6%C2%A8%C2%A1%C3%A5%C2%9E%C2%8B%C3%A8%C2%AF%C2%84%C3%A6%C2%B5%C2%8B/?(?:[?]|$)") {
    return 301 https://apframework.com/tags/%E6%A8%A1%E5%9E%8B%E8%AF%84%E6%B5%8B$is_args$args;
}

# Mirror the tag redirects in next.config.js, which static export cannot serve.
location ~ ^/tags/(ai-agents|agent|智能体|ai代理|智能代理)/?$ {
    return 301 https://apframework.com/tags/ai-agent$is_args$args;
}

location ~ ^/tags/上下文工程/?$ {
    return 301 https://apframework.com/tags/context-engineering$is_args$args;
}

location ~ ^/404/?$ {
    return 404;
}

location ~ ^(?<export_path>/.+)/$ {
    try_files $export_path.html $uri/index.html =404;
}

location / {
    try_files $uri $uri.html $uri/index.html =404;
}
